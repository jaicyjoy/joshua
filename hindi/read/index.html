<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Read</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;color:#1f2340;background:linear-gradient(180deg,#e8f4ff 0%,#fff5eb 55%,#f5e9ff 100%);min-height:100vh;line-height:1.45}
body.hi{font-family:"Noto Sans Devanagari","Mangal","Avenir Next",system-ui,sans-serif}
body.ml{font-family:"Noto Sans Malayalam","Malayalam MN","Avenir Next",system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
#app{max-width:900px;margin:0 auto;padding:12px 14px 70px}
.top{position:sticky;top:6px;z-index:10;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:22px;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 6px 0 rgba(0,0,0,.12)}
.top a{border:0;background:#fff;width:44px;height:44px;border-radius:50%;font-size:20px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:#333;flex:none}
.top .tt{flex:1;min-width:0}.top .tt small{display:block;font-size:12px;font-weight:700;opacity:.9;text-transform:uppercase}
.top .tt b{display:block;font-size:18px;line-height:1.2}
.chip{background:rgba(255,255,255,.25);border-radius:99px;padding:4px 10px;font-weight:800;font-size:13px;white-space:nowrap}
.slow{border:0;border-radius:99px;padding:7px 10px;font-weight:800;font-size:13px;background:rgba(255,255,255,.25);color:#fff}
.slow.on{background:#ffd60a;color:#3a2b00}
.hero{text-align:center;padding:14px 6px 4px}.hero .big{font-size:52px}.hero h1{margin:2px 0;font-size:28px;color:var(--c2)}.hero p{margin:0;color:#5b5f86}
.hint{background:#fff;border-radius:18px;padding:12px 14px;margin:12px 0;box-shadow:0 5px 0 #e6e3f7;font-weight:700;color:#4a4f7a;font-size:15px}
.gtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:10px}
.gt{border:0;border-radius:20px;padding:14px;text-align:left;color:#fff;background:var(--b);box-shadow:0 6px 0 rgba(0,0,0,.16)}
.gt .i{font-size:30px;display:block}.gt b{display:block;font-size:17px;margin-top:4px}.gt small{display:block;opacity:.95;font-size:13px}
.packs{display:grid;gap:10px;margin-top:14px}
.pcard{border:0;border-radius:18px;padding:14px;text-align:left;background:#fff;box-shadow:0 5px 0 #e6e3f7;display:flex;gap:12px;align-items:center;width:100%}
.pcard .em{font-size:36px}.pcard .inf{flex:1}.pcard b{display:block;font-size:18px;color:var(--c2)}.pcard small{color:#6b6f93;font-weight:700}
.pcard .st{font-size:14px;font-weight:800;color:#e08a00;white-space:nowrap}

.ov{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;background:linear-gradient(165deg,#eef4ff,#fff8ef 60%,#f8e9ff)}
.ov.show{display:flex}
.ovtop{display:flex;align-items:center;gap:10px;padding:12px 14px;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2))}
.ovtop button{border:0;background:#fff;width:42px;height:42px;border-radius:50%;font-size:18px;font-weight:900}
.ovtop .t{flex:1;font-weight:800;font-size:16px}.ovtop .sc{background:rgba(255,255,255,.25);border-radius:99px;padding:4px 10px;font-weight:800}
.ovb{flex:1;overflow-y:auto;padding:14px;max-width:860px;width:100%;margin:0 auto}
.card{background:#fff;border-radius:22px;padding:16px;box-shadow:0 7px 0 #e6e3f7}
.tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px}
.pill{border:0;border-radius:99px;padding:10px 16px;font-weight:800;font-size:15px;color:#fff;background:var(--c1);box-shadow:0 4px 0 var(--c2)}
.pill.alt{background:#fff;color:var(--c2);box-shadow:0 4px 0 #dedbf3}
.linebox{min-height:120px;display:flex;flex-wrap:wrap;gap:8px;align-content:center;justify-content:center;padding:12px;border-radius:18px;background:#f8f7ff;border:3px dashed #d8ccff}
.w{border:0;background:#fff;border-radius:14px;padding:10px 12px;font-size:var(--fs,28px);font-weight:800;color:#1f2340;box-shadow:0 3px 0 #e3e0f7;line-height:1.2}
.w.on{background:#ffd60a;transform:scale(1.06);box-shadow:0 4px 0 #f48c06}
.w.done{background:#c9f7d6}
.navl{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:8px;flex-wrap:wrap}
.nx{border:0;border-radius:99px;padding:11px 22px;font-size:16px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 4px 0 rgba(0,0,0,.15)}
.nx.alt{background:#fff;color:var(--c1);border:2px solid #cfd6ff;box-shadow:0 4px 0 #e3e0f7}
.prog{font-weight:800;color:#5b5f86}
.bigword{font-size:48px;font-weight:900;text-align:center;margin:16px 0;color:var(--c2);min-height:60px}
.opts{display:grid;gap:10px}.opt{border:2px solid #e3e0f7;background:#f8f7ff;border-radius:16px;padding:14px;font-size:22px;font-weight:800;text-align:left;box-shadow:0 4px 0 #e3e0f7}
.opt.ok{background:#c9f7d6;border-color:#2fbf71}.opt.bad{background:#ffd3d3;border-color:#e5484d;animation:shake .35s}
@keyframes shake{25%,75%{transform:translateX(-6px)}50%{transform:translateX(6px)}}
.fb{text-align:center;font-weight:800;margin-top:10px;font-size:18px}.fb.good{color:#1f9d55}.fb.bad{color:#d9480f}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.chipb{border:2px solid #e3e0f7;background:#fff;border-radius:14px;padding:10px 14px;font-size:20px;font-weight:800;box-shadow:0 3px 0 #e3e0f7}
.chipb.sel{background:#fff1b8;border-color:#ffb703}.chipb.bad{background:#ffd3d3;animation:shake .35s}
.built{min-height:56px;border:3px dashed #cfc8f5;border-radius:16px;padding:10px;background:#fff;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
.built span{background:#c9f7d6;border-radius:10px;padding:6px 10px;font-weight:800;font-size:18px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.wcard{border:3px solid #f1e8ff;background:#fffaf2;border-radius:18px;padding:12px;text-align:center;font-weight:800}
.wcard .e{font-size:32px}.wcard .ww{font-size:22px;color:var(--c2);margin-top:4px}.wcard.playing{border-color:#ffb703;background:#fff3c4}
.sizebar{display:flex;gap:8px;justify-content:center;margin:8px 0 4px}
.sizebar button{border:0;border-radius:99px;padding:6px 12px;font-weight:800;background:#efeaff}
.sizebar button.on{background:var(--c1);color:#fff}
.end{text-align:center}.end .big{font-size:56px}.stars{font-size:32px;letter-spacing:2px}
.conf{position:fixed;top:-30px;font-size:28px;pointer-events:none;z-index:60;animation:fall 1.5s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(480deg);opacity:.5}}
@media(max-width:560px){.w{font-size:var(--fs,24px)}.bigword{font-size:36px}.opt{font-size:18px}}
</style>

-jh4-wd-सब्ज़ी", "सब्ज़ी"], ["j-hi-jh5-L0-W0-मेरा", "मेरा"], ["j-hi-jh5-L0-W1-नाम", "नाम"], ["j-hi-jh5-L0-W2-जोशुआ", "जोशुआ"], ["j-hi-jh5-L0-W3-है।", "है।"], ["j-hi-jh5-L1-W0-मैं", "मैं"], ["j-hi-jh5-L1-W1-तीसरी", "तीसरी"], ["j-hi-jh5-L1-W2-कक्षा", "कक्षा"], ["j-hi-jh5-L1-W3-में", "में"], ["j-hi-jh5-L1-W4-हूँ।", "हूँ।"], ["j-hi-jh5-L2-W0-मुझे", "मुझे"], ["j-hi-jh5-L2-W1-पढ़ना", "पढ़ना"], ["j-hi-jh5-L2-W2-अच्छा", "अच्छा"], ["j-hi-jh5-L2-W3-लगता", "लगता"], ["j-hi-jh5-L2-W4-है।", "है।"], ["j-hi-jh5-L3-W0-माँ", "माँ"], ["j-hi-jh5-L3-W1-खाना", "खाना"], ["j-hi-jh5-L3-W2-बनाती", "बनाती"], ["j-hi-jh5-L3-W3-है।", "है।"], ["j-hi-jh5-L4-W0-पिताजी", "पिताजी"], ["j-hi-jh5-L4-W1-बाज़ार", "बाज़ार"], ["j-hi-jh5-L4-W2-जाते", "जाते"], ["j-hi-jh5-L4-W3-हैं।", "हैं।"], ["j-hi-jh5-wd-नाम", "नाम"], ["j-hi-jh5-wd-कक्षा", "कक्षा"], ["j-hi-jh5-wd-माँ", "माँ"], ["j-hi-jh5-wd-पिताजी", "पिताजी"]]}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const M = D.meta, PACKS = D.packs, TXT = Object.fromEntries(D.voice || []);
document.title = M.emoji + ' ' + M.title;
document.body.style.setProperty('--c1', M.c1);
document.body.style.setProperty('--c2', M.c2);
if (M.lang === 'hi') document.body.classList.add('hi');
if (M.lang === 'ml') document.body.classList.add('ml');
document.documentElement.lang = M.lang;

const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const SKEY = 'read-' + M.id;
const S = JSON.parse(localStorage.getItem(SKEY) || '{}');
let slow = localStorage.getItem(SKEY + '-slow') === '1';
let fontN = +(localStorage.getItem(SKEY + '-fs') || 1);
const FS = [24, 28, 34];
const save = () => localStorage.setItem(SKEY, JSON.stringify(S));
const award = (k, n) => { const p = S[k] || 0; if (n > p) { S[k] = n; save(); return true; } return false; };
const starStr = n => '⭐'.repeat(n) + '☆'.repeat(3 - n);
const packStars = p => (S[p.id + '-read'] || 0) + (S[p.id + '-tap'] || 0) + (S[p.id + '-build'] || 0);
const packTotal = () => 9;

const sp = new Audio();
let ptok = 0;
const rate = () => slow ? 0.7 : 0.92;
function stopAudio() { ptok++; sp.pause(); document.querySelectorAll('.on,.playing').forEach(e => { e.classList.remove('on'); e.classList.remove('playing'); }); }
function playId(id, el) {
  return new Promise(res => {
    if (!id) return res(false);
    let remote = false;
    const mine = ptok;
    if (el) el.classList.add(el.classList.contains('w') ? 'on' : 'playing');
    sp.onended = () => { if (el && mine === ptok) { el.classList.remove('on'); el.classList.remove('playing'); } res(mine === ptok); };
    sp.onerror = () => {
      if (mine !== ptok || remote) return res(false);
      remote = true;
      const t = TXT[id] || '';
      sp.src = 'https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl=' + M.tl + '&q=' + encodeURIComponent(t.slice(0, 190));
      sp.defaultPlaybackRate = sp.playbackRate = rate();
      sp.play().catch(() => {});
    };
    sp.src = 'voice/' + id + '.mp3';
    sp.defaultPlaybackRate = sp.playbackRate = rate();
    sp.play().catch(e => { if (e.name === 'NotAllowedError') res(false); });
  });
}
async function playSeq(items) {
  stopAudio();
  const mine = ptok;
  for (const {id, el} of items) {
    if (mine !== ptok) return;
    if (!(await playId(id, el))) return;
  }
}
function toggleSlow() {
  slow = !slow; localStorage.setItem(SKEY + '-slow', slow ? '1' : '0');
  sp.defaultPlaybackRate = sp.playbackRate = rate();
  document.querySelectorAll('.slow').forEach(b => b.classList.toggle('on', slow));
}
function setFs(n) {
  fontN = n; localStorage.setItem(SKEY + '-fs', n);
  document.body.style.setProperty('--fs', FS[n] + 'px');
  document.querySelectorAll('.sizebar button').forEach((b, i) => b.classList.toggle('on', i === n));
}

let actx = null;
function tone(fs, d, type, v) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = actx.currentTime;
    fs.forEach((f, k) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + k * d);
      g.gain.exponentialRampToValueAtTime(v, t0 + k * d + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + (k + 1) * d);
      o.connect(g); g.connect(actx.destination);
      o.start(t0 + k * d); o.stop(t0 + (k + 1) * d + 0.05);
    });
  } catch (e) {}
}
const ding = () => tone([660, 880, 1175], 0.1, 'sine', 0.3);
const buzz = () => tone([220, 165], 0.16, 'triangle', 0.3);
function confetti() {
  for (let i = 0; i < 16; i++) {
    const s = document.createElement('span'); s.className = 'conf';
    s.textContent = ['⭐', '🎉', '✨', '🌟'][i % 4];
    s.style.left = Math.random() * 100 + 'vw';
    document.body.appendChild(s); setTimeout(() => s.remove(), 1800);
  }
}

function home() {
  const got = PACKS.reduce((s, p) => s + packStars(p), 0);
  const tot = PACKS.length * packTotal();
  app.innerHTML = `
    <div class="top">
      <a href="${M.back}" title="Back">🏠</a>
      <div class="tt"><small>${M.subject} · Class ${M.grade}</small><b>${M.emoji} ${esc(M.title)}</b></div>
      <span class="chip">⭐ ${got}/${tot}</span>
      <button class="slow ${slow ? 'on' : ''}" onclick="toggleSlow()">🐢 Slow</button>
    </div>
    <div class="hero"><div class="big">${M.emoji}</div><h1>${esc(M.title)}</h1>
      <p>${M.grade <= 3 ? 'Big words · hear every word · read together' : 'Follow the line · tap hard words · build fluency'}</p></div>
    <div class="hint">💡 ${esc(M.hint)}</div>
    <div class="sizebar">
      <button class="${fontN === 0 ? 'on' : ''}" onclick="setFs(0)">A</button>
      <button class="${fontN === 1 ? 'on' : ''}" onclick="setFs(1)">A+</button>
      <button class="${fontN === 2 ? 'on' : ''}" onclick="setFs(2)">A++</button>
    </div>
    <div class="packs">${PACKS.map(p => {
      const st = packStars(p);
      return `<button class="pcard" onclick="openPack('${p.id}')"><span class="em">${p.emoji}</span>
        <div class="inf"><b>${esc(p.title)}</b><small>${p.lines.length} lines · ${p.words.length} words</small></div>
        <span class="st">${starStr(Math.min(3, Math.round(st / 3)))}</span></button>`;
    }).join('')}</div>`;
  setFs(fontN);
}

const ov = document.getElementById('ov'), ovb = () => document.getElementById('ovb');
let G = null;
function openOv(title) {
  stopAudio();
  document.getElementById('ovt').textContent = title;
  document.getElementById('ovs').textContent = '';
  ov.classList.add('show'); document.body.style.overflow = 'hidden';
}
function closeOv() { stopAudio(); ov.classList.remove('show'); document.body.style.overflow = ''; G = null; home(); }
const setScore = t => document.getElementById('ovs').innerHTML = t;

function openPack(pid) {
  const p = PACKS.find(x => x.id === pid);
  G = {p};
  openOv(p.emoji + ' ' + p.title);
  ovb().innerHTML = `<div class="card">
    <div class="gtiles">
      <button class="gt" style="--b:linear-gradient(135deg,#4361ee,#7b2cbf)" onclick="startRead()">
        <span class="i">🔊</span><b>${M.lang === 'hi' ? 'साथ में पढ़ो' : M.lang === 'ml' ? 'കൂടെ വായിക്കാം' : 'Read with me'}</b>
        <small>${M.lang === 'en' ? 'Hear each word, follow the highlight' : 'വാക്ക് തിരിച്ചറിഞ്ഞ് വായിക്കുക / शब्द सुनकर पढ़ें'}</small></button>
      <button class="gt" style="--b:linear-gradient(135deg,#06d6a0,#118ab2)" onclick="startTap()">
        <span class="i">👆</span><b>${M.lang === 'hi' ? 'सुनो और चुनो' : M.lang === 'ml' ? 'കേൾക്കൂ, തിരഞ്ഞെടുക്കൂ' : 'Hear & find'}</b>
        <small>${M.lang === 'en' ? 'Listen, then tap the right word' : 'ശരിയായ വാക്ക് കണ്ടെത്തുക'}</small></button>
      <button class="gt" style="--b:linear-gradient(135deg,#ff9f1c,#e76f51)" onclick="startBuild()">
        <span class="i">🧩</span><b>${M.lang === 'hi' ? 'वाक्य बनाओ' : M.lang === 'ml' ? 'വാക്യം ഉണ്ടാക്കൂ' : 'Build the line'}</b>
        <small>${M.lang === 'en' ? 'Put the words in order' : 'വാക്കുകൾ ക്രമത്തിൽ വയ്ക്കുക'}</small></button>
      ${p.words.length ? `<button class="gt" style="--b:linear-gradient(135deg,#ef476f,#b5179e)" onclick="startWords()">
        <span class="i">🃏</span><b>${M.lang === 'hi' ? 'शब्द कार्ड' : M.lang === 'ml' ? 'വാക്ക് കാർഡ്' : 'Word cards'}</b>
        <small>${M.lang === 'en' ? 'Tap cards to hear hard words' : 'കഠിന വാക്കുകൾ കേൾക്കുക'}</small></button>` : ''}
    </div>
    <div style="text-align:center;margin-top:12px"><button class="nx alt" onclick="closeOv()">✕ Close</button></div>
  </div>`;
}

function toks(line) {
  // Keep punctuation attached lightly; split on spaces
  return line.trim().split(/\s+/).filter(Boolean);
}

function startRead() {
  const p = G.p;
  G.mode = 'read'; G.i = 0; G.done = 0;
  openOv('🔊 ' + p.title);
  showRead();
}
function showRead() {
  const p = G.p;
  if (G.i >= p.lines.length) {
    award(p.id + '-read', 3); confetti(); ding();
    ovb().innerHTML = `<div class="card end"><div class="big">🏆</div><h2>${M.lang === 'ml' ? 'കൊള്ളാം!' : M.lang === 'hi' ? 'शाबाश!' : 'Great reading!'}</h2>
      <div class="stars">⭐⭐⭐</div>
      <button class="nx" onclick="startRead()">🔁 Again</button>
      <button class="nx alt" onclick="openPack('${p.id}')">← Back</button></div>`;
    return;
  }
  const line = p.lines[G.i];
  const words = toks(line);
  setScore(`${G.i + 1}/${p.lines.length}`);
  ovb().innerHTML = `<div class="card">
    <div class="tools">
      <button class="pill" id="playAll">▶ ${M.lang === 'ml' ? 'പ്ലേ' : M.lang === 'hi' ? 'चलाएँ' : 'Play line'}</button>
      <button class="pill alt" onclick="stopAudio()">⏸ Stop</button>
    </div>
    <div class="linebox" id="lb">${words.map((w, k) => `<button class="w" data-k="${k}" data-id="${p.lineAudio[G.i][k]}">${esc(w)}</button>`).join('')}</div>
    <p style="text-align:center;color:#6b6f93;font-weight:700;margin:10px 0 0">💡 ${M.lang === 'en' ? 'Tap any word to hear it alone' : 'ഓരോ വാക്കും ടാപ്പ് ചെയ്ത് കേൾക്കാം / किसी भी शब्द पर टैप करें'}</p>
    <div class="navl">
      <button class="nx alt" ${G.i === 0 ? 'disabled' : ''} onclick="G.i--;showRead()">← Prev</button>
      <span class="prog">${G.i + 1} / ${p.lines.length}</span>
      <button class="nx" onclick="G.i++;showRead()">Next →</button>
    </div>
  </div>`;
  document.body.style.setProperty('--fs', FS[fontN] + 'px');
  document.getElementById('lb').onclick = e => {
    const b = e.target.closest('.w'); if (!b) return;
    playId(b.dataset.id, b);
  };
  document.getElementById('playAll').onclick = () => {
    const btns = [...document.querySelectorAll('.w')];
    playSeq(btns.map(b => ({id: b.dataset.id, el: b})));
  };
  // auto-play the line once for struggling readers
  setTimeout(() => document.getElementById('playAll').click(), 250);
}

function startTap() {
  const p = G.p;
  const items = [];
  p.lines.forEach((line, li) => toks(line).forEach((w, wi) => {
    if (w.length >= (M.grade <= 3 ? 2 : 3)) items.push({w, id: p.lineAudio[li][wi], line});
  }));
  G.mode = 'tap'; G.queue = shuffle(items).slice(0, Math.min(12, items.length)); G.i = 0; G.ok = 0; G.miss = 0;
  openOv('👆 Hear & find');
  showTap();
}
function showTap() {
  if (G.i >= G.queue.length) {
    const s = G.miss === 0 ? 3 : G.miss <= 3 ? 2 : 1;
    award(G.p.id + '-tap', s); confetti(); ding();
    ovb().innerHTML = `<div class="card end"><div class="big">${s === 3 ? '🏆' : '🥳'}</div>
      <h2>${G.ok}/${G.queue.length} ${M.lang === 'en' ? 'correct' : 'ശരി / सही'}</h2>
      <div class="stars">${starStr(s)}</div>
      <button class="nx" onclick="startTap()">🔁 Again</button>
      <button class="nx alt" onclick="openPack('${G.p.id}')">← Back</button></div>`;
    return;
  }
  const x = G.queue[G.i];
  const pool = shuffle(G.queue.map(q => q.w).filter((w, i, a) => a.indexOf(w) === i && w !== x.w)).slice(0, 3);
  const opts = shuffle([x.w, ...pool]);
  G.answered = false;
  setScore(`${G.i + 1}/${G.queue.length}`);
  ovb().innerHTML = `<div class="card" style="text-align:center">
    <button class="pill" style="width:80px;height:80px;border-radius:50%;font-size:32px" onclick="playId('${x.id}',this)">🔊</button>
    <p class="fb" style="color:#5b5f86">${M.lang === 'en' ? 'Which word did you hear?' : M.lang === 'hi' ? 'कौन-सा शब्द सुना?' : 'ഏത് വാക്ക് കേട്ടു?'}</p>
    <div class="opts">${opts.map(o => `<button class="opt" data-w="${esc(o)}" onclick="pickTap(this)">${esc(o)}</button>`).join('')}</div>
    <div id="after"></div>
  </div>`;
  playId(x.id);
}
function pickTap(btn) {
  if (G.answered) return;
  G.answered = true;
  const x = G.queue[G.i];
  document.querySelectorAll('.opt').forEach(b => b.disabled = true);
  if (btn.dataset.w === x.w) {
    btn.classList.add('ok'); ding(); G.ok++;
    document.getElementById('after').innerHTML = `<div class="fb good">${M.lang === 'en' ? 'Yes!' : 'ശരി! / सही!'}</div><button class="nx" onclick="G.i++;showTap()">Next →</button>`;
  } else {
    btn.classList.add('bad'); buzz(); G.miss++;
    document.querySelectorAll('.opt').forEach(b => { if (b.dataset.w === x.w) b.classList.add('ok'); });
    document.getElementById('after').innerHTML = `<div class="fb bad">${M.lang === 'en' ? 'The green one is right' : 'പച്ച നിറമുള്ളത് ശരി / हरा सही है'}</div><button class="nx" onclick="G.i++;showTap()">Next →</button>`;
  }
}

function startBuild() {
  const p = G.p;
  G.mode = 'build'; G.queue = shuffle(p.lines.map((line, li) => ({line, ids: p.lineAudio[li]}))); G.i = 0; G.miss = 0;
  openOv('🧩 Build the line');
  showBuild();
}
function showBuild() {
  if (G.i >= G.queue.length) {
    const s = G.miss === 0 ? 3 : G.miss <= 2 ? 2 : 1;
    award(G.p.id + '-build', s); confetti(); ding();
    ovb().innerHTML = `<div class="card end"><div class="big">🏆</div><div class="stars">${starStr(s)}</div>
      <button class="nx" onclick="startBuild()">🔁 Again</button>
      <button class="nx alt" onclick="openPack('${G.p.id}')">← Back</button></div>`;
    return;
  }
  const x = G.queue[G.i];
  G.parts = toks(x.line); G.pos = 0;
  setScore(`${G.i + 1}/${G.queue.length}`);
  G.curIds = x.ids;
  const tiles = shuffle(G.parts.map((w, i) => ({w, i, id: x.ids[i]})));
  ovb().innerHTML = `<div class="card">
    <p class="fb" style="color:#5b5f86">${M.lang === 'en' ? 'Tap the words in the right order' : 'ശരിയായ ക്രമത്തിൽ ടാപ്പ് ചെയ്യുക / सही क्रम में टैप करें'}</p>
    <button class="pill alt" onclick="playSeq(G.curIds.map(id=>({id})))">🔊 ${M.lang === 'en' ? 'Hear the line first' : 'ആദ്യം കേൾക്കുക / पहले सुनें'}</button>
    <div class="built" id="built"></div>
    <div class="pool">${tiles.map(t => `<button class="chipb" data-i="${t.i}" data-w="${esc(t.w)}" data-id="${t.id}" onclick="pickBuild(this)">${esc(t.w)}</button>`).join('')}</div>
    <div id="after"></div>
  </div>`;
}
function pickBuild(btn) {
  if (+btn.dataset.i === G.pos) {
    document.getElementById('built').insertAdjacentHTML('beforeend', `<span>${esc(btn.dataset.w)}</span>`);
    playId(btn.dataset.id);
    btn.remove(); G.pos++;
    if (G.pos === G.parts.length) {
      ding(); confetti();
      document.getElementById('after').innerHTML = `<div class="fb good">${M.lang === 'en' ? 'Perfect!' : 'കൊള്ളാം! / शाबाश!'}</div><button class="nx" onclick="G.i++;showBuild()">Next →</button>`;
    }
  } else {
    G.miss++; buzz(); btn.classList.add('bad'); setTimeout(() => btn.classList.remove('bad'), 350);
  }
}

function startWords() {
  const p = G.p;
  openOv('🃏 Word cards');
  ovb().innerHTML = `<div class="card"><div class="wgrid">${p.words.map((w, k) => {
    const id = p.wordAudio[k];
    return `<button class="wcard" onclick="playId('${id}',this)"><div class="e">${esc(w[1] || '🔤')}</div><div class="ww">${esc(w[0])}</div></button>`;
  }).join('')}</div>
  <div style="text-align:center;margin-top:14px"><button class="nx alt" onclick="openPack('${p.id}')">← Back</button></div></div>`;
}

home();
</script>
</body>
