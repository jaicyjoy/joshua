<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>हिंदी पढ़ना · कक्षा 3</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;color:#1f2340;background:linear-gradient(180deg,#e8f4ff 0%,#fff5eb 55%,#f5e9ff 100%);min-height:100vh;line-height:1.45}
button{font-family:inherit;cursor:pointer}
#app{max-width:900px;margin:0 auto;padding:12px 14px 70px}
.top{position:sticky;top:6px;z-index:10;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:22px;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 6px 0 rgba(0,0,0,.12)}
.top a,.top button.ib{border:0;background:#fff;width:44px;height:44px;border-radius:50%;font-size:20px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:#333;flex:none}
.top .tt{flex:1;min-width:0}.top .tt small{display:block;font-size:12px;font-weight:700;opacity:.9;text-transform:uppercase}
.top .tt b{display:block;font-size:18px;line-height:1.2}
.chip{background:rgba(255,255,255,.25);border-radius:99px;padding:4px 10px;font-weight:800;font-size:13px;white-space:nowrap}
.banner{border-radius:20px;padding:14px 16px;margin:14px 0;font-weight:800;font-size:16px;box-shadow:0 5px 0 rgba(0,0,0,.08)}
.banner.great{background:#c9f7d6;color:#145233;border:2px solid #2fbf71}
.banner.ok{background:#fff1b8;color:#7a5200;border:2px solid #ffb703}
.banner.practice{background:#ffe8e8;color:#9b2226;border:2px solid #e5484d}
.banner.start{background:#fff;border:2px solid #e3e0f7;color:#4a4f7a}
.hero{text-align:center;padding:10px 6px 4px}.hero .big{font-size:48px}.hero h1{margin:2px 0;font-size:26px;color:var(--c2)}.hero p{margin:0;color:#5b5f86;font-size:15px}
.hint{background:#fff;border-radius:18px;padding:12px 14px;margin:10px 0;box-shadow:0 5px 0 #e6e3f7;font-weight:700;color:#4a4f7a;font-size:15px}
.gtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:10px}
.gt{border:0;border-radius:20px;padding:14px;text-align:left;color:#fff;background:var(--b);box-shadow:0 6px 0 rgba(0,0,0,.16);width:100%}
.gt .i{font-size:30px;display:block}.gt b{display:block;font-size:17px;margin-top:4px}.gt small{display:block;opacity:.95;font-size:13px;margin-top:2px}
.gt .st{display:inline-block;margin-top:8px;font-size:15px;letter-spacing:1px;background:rgba(0,0,0,.15);padding:3px 10px;border-radius:99px}
.ov{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;background:linear-gradient(165deg,#eef4ff,#fff8ef 60%,#f8e9ff)}
.ov.show{display:flex}
.ovtop{display:flex;align-items:center;gap:10px;padding:12px 14px;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2))}
.ovtop button{border:0;background:#fff;width:42px;height:42px;border-radius:50%;font-size:18px;font-weight:900}
.ovtop .t{flex:1;font-weight:800;font-size:16px}.ovtop .sc{background:rgba(255,255,255,.25);border-radius:99px;padding:4px 10px;font-weight:800;font-size:13px}
.ovb{flex:1;overflow-y:auto;padding:14px;max-width:860px;width:100%;margin:0 auto}
.card{background:#fff;border-radius:22px;padding:16px;box-shadow:0 7px 0 #e6e3f7}
.prog{font-weight:800;color:#5b5f86;margin-bottom:10px;font-size:15px}
.prompt{font-size:14px;font-weight:800;color:#6b6f93;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.bigtext{font-size:clamp(26px,6vw,42px);font-weight:900;text-align:center;margin:12px 0 16px;color:var(--c2);line-height:1.35}
.readbox{background:#f8f7ff;border:3px dashed #d8ccff;border-radius:18px;padding:16px;font-size:18px;line-height:1.65;margin:10px 0;color:#1f2340}
.readbox.poem{white-space:pre-line;font-size:19px}
.readbox h3{margin:0 0 8px;font-size:20px;color:var(--c2)}
.qtext{font-size:18px;font-weight:800;margin:14px 0 10px;color:#1f2340}
.opts{display:grid;gap:10px}.opt{border:2px solid #e3e0f7;background:#f8f7ff;border-radius:16px;padding:14px;font-size:17px;font-weight:700;text-align:left;box-shadow:0 4px 0 #e3e0f7;width:100%}
.opt.ok{background:#c9f7d6;border-color:#2fbf71;box-shadow:0 4px 0 #2fbf71}.opt.bad{background:#ffd3d3;border-color:#e5484d;animation:shake .35s}
@keyframes shake{25%,75%{transform:translateX(-6px)}50%{transform:translateX(6px)}}
.fb{text-align:center;font-weight:800;margin-top:12px;font-size:18px}.fb.good{color:#1f9d55}.fb.bad{color:#d9480f}
.navl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.nx{border:0;border-radius:99px;padding:11px 22px;font-size:16px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 4px 0 rgba(0,0,0,.15)}
.nx.alt{background:#fff;color:var(--c1);border:2px solid #cfd6ff;box-shadow:0 4px 0 #e3e0f7}
.end{text-align:center}.end .big{font-size:56px}.stars{font-size:32px;letter-spacing:2px}
.pick{display:grid;gap:10px;margin-top:8px}
.pbtn{border:2px solid #e3e0f7;background:#fff;border-radius:16px;padding:14px;text-align:left;font-weight:800;font-size:17px;color:var(--c2);box-shadow:0 4px 0 #e3e0f7;width:100%}
.pbtn small{display:block;font-weight:700;color:#6b6f93;font-size:13px;margin-top:4px}
@media(max-width:560px){.bigtext{font-size:28px}.opt{font-size:15px}.readbox{font-size:16px}}
</style>
</head>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const M = D.meta;
document.title = M.emoji + ' ' + M.title + ' · ' + M.grade;
document.body.style.setProperty('--c1', M.c1);
document.body.style.setProperty('--c2', M.c2);

const app = document.getElementById('app');
const ov = document.getElementById('ov');
const ovb = () => document.getElementById('ovb');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const starStr = n => '⭐'.repeat(n) + '☆'.repeat(3 - n);

const SKEY = M.lsKey;
let store = JSON.parse(localStorage.getItem(SKEY) || '{}');
if (!store.stars) store.stars = {};
if (!store.tried) store.tried = {};
const save = () => localStorage.setItem(SKEY, JSON.stringify(store));
const getStar = id => store.stars[id] || 0;
const setStar = (id, n) => { if (n > (store.stars[id] || 0)) { store.stars[id] = n; save(); return true; } return false; };
const markTried = id => { store.tried[id] = true; save(); };

function starsFromAccuracy(correct, total) {
  if (!total) return 0;
  const p = correct / total;
  if (p >= 0.85) return 3;
  if (p >= 0.65) return 2;
  if (p >= 0.4) return 1;
  return 0;
}

function coverageBanner() {
  const modes = D.modes.map(m => m.id);
  const triedAll = modes.every(id => store.tried[id]);
  const starSum = modes.reduce((s, id) => s + getStar(id), 0);
  const allGood = modes.every(id => getStar(id) >= 2);
  if (triedAll && allGood) return { cls: 'great', text: '🎉 All portions done — great stars! You read well.' };
  if (triedAll) return { cls: 'ok', text: '✅ You tried every portion. Replay weak modes for more stars.' };
  if (starSum >= 8) return { cls: 'great', text: '🌟 Good stars so far! Finish the remaining portions.' };
  const any = modes.some(id => store.tried[id]);
  if (any) return { cls: 'practice', text: '📚 Needs practice — read again and aim for 3 stars.' };
  return { cls: 'start', text: '👋 Read aloud yourself, then choose answers. No speaker here!' };
}

function home() {
  const b = coverageBanner();
  const modes = D.modes;
  const starSum = modes.reduce((s, m) => s + getStar(m.id), 0);
  app.innerHTML = `
    <div class="top">
      <a href="../../index.html" title="Home">🏠</a>
      <button type="button" class="ib" onclick="history.back()" title="Back">←</button>
      <div class="tt"><small>${esc(M.grade)}</small><b>${M.emoji} ${esc(M.title)}</b></div>
      <span class="chip">${starSum}/${modes.length * 3}★</span>
    </div>
    <div class="hero"><div class="big">${M.emoji}</div><h1>${esc(M.title)}</h1><p>Silent reading · you read, then answer</p></div>
    <div class="banner ${b.cls}">${esc(b.text)}</div>
    <div class="hint">💡 ${esc(M.hint)}</div>
    <div class="gtiles">${modes.map(m => `
      <button type="button" class="gt" style="--b:${m.color}" onclick="openMode('${m.id}')">
        <span class="i">${m.emoji}</span><b>${esc(m.title)}</b><small>${esc(m.sub)}</small>
        <span class="st">${starStr(getStar(m.id))}</span>
      </button>`).join('')}</div>`;
}

let G = null;
function openOv(title, score) {
  document.getElementById('ovt').textContent = title;
  document.getElementById('ovs').textContent = score || '';
  ov.classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeOv() { ov.classList.remove('show'); document.body.style.overflow = ''; G = null; home(); }
function setScore(t) { document.getElementById('ovs').textContent = t; }

function openMode(id) {
  G = { mode: id, correct: 0, total: 0, qi: 0, phase: 'quiz', pick: null };
  const m = D.modes.find(x => x.id === id);
  openOv(m.emoji + ' ' + m.title, '');
  if (id === 'words') { G.items = shuffle(D.words); G.i = 0; showWordQ(); }
  else if (id === 'sentences') { G.items = shuffle(D.sentences); G.i = 0; showSentQ(); }
  else if (id === 'passage') showPassagePick();
  else if (id === 'poem') showPoemPick();
}

function showWordQ() {
  if (G.i >= G.items.length) return finishMode('words');
  const item = G.items[G.i];
  const opts = shuffle(item.options.map((t, i) => ({ t, i })));
  ovb().innerHTML = `<div class="card">
    <div class="prog">${G.i + 1} / ${G.items.length}</div>
    <div class="prompt">Read this word</div>
    <div class="bigtext">${esc(item.w)}</div>
    <div class="prompt">Choose the best meaning</div>
    <div class="opts" id="opts">${opts.map(o => `<button type="button" class="opt" data-i="${o.i}">${esc(o.t)}</button>`).join('')}</div>
    <div class="fb" id="fb"></div>
  </div>`;
  bindOpts(item.a, () => { G.i++; showWordQ(); });
}

function showSentQ() {
  if (G.i >= G.items.length) return finishMode('sentences');
  const item = G.items[G.i];
  const opts = shuffle(item.options.map((t, i) => ({ t, i })));
  ovb().innerHTML = `<div class="card">
    <div class="prog">${G.i + 1} / ${G.items.length}</div>
    <div class="prompt">Read this sentence</div>
    <div class="readbox">${esc(item.s)}</div>
    <div class="prompt">Choose the best meaning</div>
    <div class="opts" id="opts">${opts.map(o => `<button type="button" class="opt" data-i="${o.i}">${esc(o.t)}</button>`).join('')}</div>
    <div class="fb" id="fb"></div>
  </div>`;
  bindOpts(item.a, () => { G.i++; showSentQ(); });
}

function showPassagePick() {
  ovb().innerHTML = `<div class="card">
    <p class="prompt">Read the passage yourself, then answer questions.</p>
    <div class="pick">
      <button type="button" class="pbtn" onclick="startPassage(0)">📄 ${esc(D.passages[0].title)}<small>3+ questions</small></button>
      <button type="button" class="pbtn" onclick="startPassage(1)">📄 ${esc(D.passages[1].title)}<small>3+ questions</small></button>
      <button type="button" class="pbtn" onclick="startPassage('all')">📚 Both passages<small>Full practice round</small></button>
    </div>
    <div class="navl"><button type="button" class="nx alt" onclick="closeOv()">← Home</button></div>
  </div>`;
}

function startPassage(which) {
  G.passages = which === 'all' ? [0, 1] : [which];
  G.pi = 0;
  G.phase = 'read';
  G.correct = 0;
  G.total = 0;
  G.qi = 0;
  showPassageRead();
}

function showPassageRead() {
  const p = D.passages[G.passages[G.pi]];
  ovb().innerHTML = `<div class="card">
    <div class="prog">Passage ${G.pi + 1} of ${G.passages.length}</div>
    <div class="readbox"><h3>${esc(p.title)}</h3>${esc(p.text)}</div>
    <p style="text-align:center;font-weight:800;color:#5b5f86">Read it carefully aloud, then continue.</p>
    <div class="navl"><button type="button" class="nx" onclick="G.phase='quiz';G.qi=0;showPassageQ()">I'm ready →</button></div>
  </div>`;
}

function showPassageQ() {
  const p = D.passages[G.passages[G.pi]];
  if (G.qi >= p.questions.length) {
    G.pi++;
    if (G.pi >= G.passages.length) return finishMode('passage');
    G.phase = 'read';
    G.qi = 0;
    return showPassageRead();
  }
  const q = p.questions[G.qi];
  const opts = shuffle(q.options.map((t, i) => ({ t, i })));
  ovb().innerHTML = `<div class="card">
    <div class="prog">${esc(p.title)} · Q ${G.qi + 1}/${p.questions.length}</div>
    <div class="qtext">${esc(q.q)}</div>
    <div class="opts" id="opts">${opts.map(o => `<button type="button" class="opt" data-i="${o.i}">${esc(o.t)}</button>`).join('')}</div>
    <div class="fb" id="fb"></div>
  </div>`;
  bindOpts(q.a, () => { G.qi++; showPassageQ(); });
}

function showPoemPick() {
  ovb().innerHTML = `<div class="card">
    <p class="prompt">Read the poem yourself, then answer questions.</p>
    <div class="pick">
      <button type="button" class="pbtn" onclick="startPoem(0)">🎵 ${esc(D.poems[0].title)}<small>3+ questions</small></button>
      <button type="button" class="pbtn" onclick="startPoem(1)">🎵 ${esc(D.poems[1].title)}<small>3+ questions</small></button>
      <button type="button" class="pbtn" onclick="startPoem('all')">📚 Both poems<small>Full practice round</small></button>
    </div>
    <div class="navl"><button type="button" class="nx alt" onclick="closeOv()">← Home</button></div>
  </div>`;
}

function startPoem(which) {
  G.poems = which === 'all' ? [0, 1] : [which];
  G.pi = 0;
  G.correct = 0;
  G.total = 0;
  G.qi = 0;
  showPoemRead();
}

function showPoemRead() {
  const p = D.poems[G.poems[G.pi]];
  ovb().innerHTML = `<div class="card">
    <div class="prog">Poem ${G.pi + 1} of ${G.poems.length}</div>
    <div class="readbox poem"><h3>${esc(p.title)}</h3>${esc(p.text)}</div>
    <p style="text-align:center;font-weight:800;color:#5b5f86">Read the lines with feeling, then continue.</p>
    <div class="navl"><button type="button" class="nx" onclick="G.qi=0;showPoemQ()">I'm ready →</button></div>
  </div>`;
}

function showPoemQ() {
  const p = D.poems[G.poems[G.pi]];
  if (G.qi >= p.questions.length) {
    G.pi++;
    if (G.pi >= G.poems.length) return finishMode('poem');
    G.qi = 0;
    return showPoemRead();
  }
  const q = p.questions[G.qi];
  const opts = shuffle(q.options.map((t, i) => ({ t, i })));
  ovb().innerHTML = `<div class="card">
    <div class="prog">${esc(p.title)} · Q ${G.qi + 1}/${p.questions.length}</div>
    <div class="qtext">${esc(q.q)}</div>
    <div class="opts" id="opts">${opts.map(o => `<button type="button" class="opt" data-i="${o.i}">${esc(o.t)}</button>`).join('')}</div>
    <div class="fb" id="fb"></div>
  </div>`;
  bindOpts(q.a, () => { G.qi++; showPoemQ(); });
}

function bindOpts(correctIdx, next) {
  let locked = false;
  document.querySelectorAll('#opts .opt').forEach(btn => {
    btn.onclick = () => {
      if (locked) return;
      locked = true;
      const pick = +btn.dataset.i;
      const ok = pick === correctIdx;
      G.total++;
      if (ok) G.correct++;
      document.querySelectorAll('#opts .opt').forEach(b => {
        b.disabled = true;
        if (+b.dataset.i === correctIdx) b.classList.add('ok');
        else if (+b.dataset.i === pick) b.classList.add('bad');
      });
      const fb = document.getElementById('fb');
      fb.className = 'fb ' + (ok ? 'good' : 'bad');
      fb.textContent = ok ? 'Correct! 🌟' : 'Not quite — read again and remember.';
      setScore(G.correct + '/' + G.total);
      setTimeout(next, ok ? 700 : 1200);
    };
  });
}

function finishMode(modeId) {
  markTried(modeId);
  const stars = starsFromAccuracy(G.correct, G.total);
  const improved = setStar(modeId, stars);
  ovb().innerHTML = `<div class="card end">
    <div class="big">${stars >= 2 ? '🏆' : '📖'}</div>
    <h2 style="color:var(--c2);margin:8px 0">Round complete!</h2>
    <p style="font-weight:800;font-size:18px">${G.correct} / ${G.total} correct</p>
    <div class="stars">${starStr(stars)}</div>
    <p style="color:#5b5f86;font-weight:700">${improved ? 'New best for this mode!' : 'Keep reading to improve your stars.'}</p>
    <div class="navl">
      <button type="button" class="nx" onclick="openMode('${modeId}')">🔁 Again</button>
      <button type="button" class="nx alt" onclick="closeOv()">← Home</button>
    </div>
  </div>`;
}

home();
</script>
</body>
</html>
