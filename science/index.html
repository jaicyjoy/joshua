<style>

#app{max-width:880px;margin:0 auto;padding:12px 14px 70px}

.hero{text-align:center;padding:14px 6px 4px}

.starbox .bn{font-weight:800;color:#6a5f8f}
.bar{height:16px;background:#f3ecff;border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#ffd60a,#ff9f1c,#ff4f8b);transition:width .5s}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ccard{border:0;border-radius:26px;padding:16px;text-align:left;color:#fff;background:linear-gradient(140deg,var(--c1),var(--c2));box-shadow:0 7px 0 rgba(0,0,0,.18);transition:transform .12s}

.ccard .em{font-size:52px;float:right;line-height:1}

.ccard h2{margin:2px 0 10px;font-size:24px;line-height:1.2}
.ccard .bar{background:rgba(255,255,255,.35)}
.ccard .bar i{background:#ffe066}
.ccard .st{font-weight:800;font-size:15px;margin-top:6px}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-top:14px}

.topbar{position:sticky;top:6px;z-index:10;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:24px;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 6px 0 rgba(0,0,0,.14)}

.chip{background:rgba(255,255,255,.28);border-radius:99px;padding:5px 11px;font-weight:900;font-size:15px;white-space:nowrap}
.slowbtn{border:0;border-radius:99px;padding:7px 11px;font-weight:900;font-size:14px;background:rgba(255,255,255,.28);color:#fff;white-space:nowrap}
.slowbtn.on{background:#ffd60a;color:#4a3500}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.tab{border:0;border-radius:18px;padding:12px;font-weight:900;font-size:19px;background:#fff;box-shadow:0 5px 0 #eadff7}
.tab.on{background:var(--c1);color:#fff;box-shadow:0 5px 0 var(--c2)}

.sec{background:#fff;border-radius:24px;padding:14px;margin-bottom:16px;box-shadow:0 6px 0 #eadff7}
.sec h3{margin:0 0 10px;font-size:22px;color:var(--c2)}
.sec .hint{margin:-6px 0 10px;color:#7a7096;font-size:15px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.wcard{border:3px solid #f1e8ff;background:#fffaf2;border-radius:20px;padding:12px;text-align:center;box-shadow:0 4px 0 #f1e8ff}
.wcard.playing{border-color:#ffb703;background:#fff3c4}
.wcard .e{font-size:44px;line-height:1.1}
.wcard .w{font-size:24px;font-weight:900;color:var(--c2)}
.wcard .m{font-size:18px}
.wcard .m b{color:#e76f51}
.opp{display:flex;align-items:center;justify-content:center;gap:8px;border:3px solid #f1e8ff;background:#fffaf2;border-radius:20px;padding:10px;margin-bottom:10px;width:100%;box-shadow:0 4px 0 #f1e8ff}
.opp.playing{border-color:#ffb703;background:#fff3c4}
.opp div{flex:1;text-align:center;font-size:22px;font-weight:900}
.opp div span{display:block;font-size:38px;line-height:1.1}
.opp .ar{flex:none;font-size:26px;color:#e76f51}
.rules{display:grid;gap:8px;margin-bottom:12px}
.rules div{border-radius:16px;padding:10px 12px;font-size:17px;font-weight:700}
.rules b{font-size:19px}
.qa{border:3px solid #f1e8ff;border-radius:20px;padding:12px;margin-bottom:12px;background:#fbf8ff}
.qa .q{display:flex;gap:10px;align-items:flex-start;font-size:19px;font-weight:900}
.qa .q span{flex:1}
.qa .ans{display:flex;gap:10px;align-items:flex-start;margin-top:10px;background:#e7fbef;border-radius:14px;padding:10px;font-size:18px}
.qa .ans span{flex:1}
.qa .show{margin-top:10px;border:0;border-radius:99px;padding:9px 16px;font-weight:900;font-size:16px;color:#fff;background:var(--c1);box-shadow:0 4px 0 var(--c2)}
.qa.playing{border-color:#ffb703}
.say{border:0;background:#efe7ff;border-radius:50%;width:44px;height:44px;font-size:18px;flex:none}
.say.playing{background:#ffb703}
.fam{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.fam div{background:#fff;border:3px solid #f1e8ff;border-radius:16px;padding:6px 10px;text-align:center;font-weight:800;font-size:15px}
.fam div span{display:block;font-size:34px}
.fam div i{display:block;font-style:normal;color:#e76f51;font-size:14px}
.gh{margin:22px 4px 10px;font-size:24px;color:#5a189a}
.grow{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:3px solid #f1e8ff;background:#fffaf2;border-radius:18px;padding:10px 12px;margin-bottom:8px;box-shadow:0 3px 0 #f1e8ff}
.grow.playing{border-color:#ffb703;background:#fff3c4}
.grow .ge{font-size:30px;flex:none;width:40px;text-align:center}
.grow .gtx{flex:1;font-size:18px;font-weight:700}
.spl{display:flex;flex-wrap:wrap;gap:8px}
.spl button{border:3px solid #f1e8ff;background:#fffaf2;border-radius:99px;padding:8px 14px;font-size:19px;font-weight:900;color:var(--c2);box-shadow:0 4px 0 #f1e8ff}
.spl button small{font-size:13px;color:#e08a00;margin-left:4px}

.gtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.gt{border:0;border-radius:24px;padding:16px;text-align:left;color:#fff;background:var(--b);box-shadow:0 6px 0 rgba(0,0,0,.18)}
.gt .i{font-size:38px;display:block;line-height:1.1}
.gt b{display:block;font-size:20px;line-height:1.2;margin-top:4px}
.gt small{display:block;font-size:14px;opacity:.95}
.gt .s{display:block;font-size:22px;margin-top:6px;letter-spacing:2px}
.foot{text-align:center;margin-top:22px;font-size:15px;color:#7a7096}

.ov{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;background:linear-gradient(170deg,#e9f7ff,#fff6dc 55%,#ffe9f2)}
.ov.show{display:flex}
.ovtop{display:flex;align-items:center;gap:10px;padding:12px 14px;color:#fff;background:linear-gradient(135deg,var(--c1,#7b5cff),var(--c2,#ff4f8b))}
.ovtop button{border:0;background:#fff;width:44px;height:44px;border-radius:50%;font-size:19px;font-weight:900;color:#333;flex:none}
.ovtop .t{flex:1;font-weight:900;font-size:19px}
.ovtop .sc{background:rgba(255,255,255,.28);border-radius:99px;padding:4px 12px;font-weight:900;white-space:nowrap}
.ovb{flex:1;overflow-y:auto;padding:16px 14px 40px;max-width:800px;width:100%;margin:0 auto}
.card{background:#fff;border-radius:26px;padding:16px;box-shadow:0 7px 0 #eadff7}
.prog{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-weight:900;color:#6a5f8f}
.prog .bar{flex:1;margin:0}
.kind{display:inline-block;border-radius:99px;padding:3px 12px;color:#fff;font-size:14px;font-weight:900;background:var(--k)}
.bigq{display:flex;gap:10px;align-items:flex-start;margin-top:10px;font-size:23px;font-weight:900;line-height:1.4}
.bigq span{flex:1}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{border:3px solid #eadff7;background:#fbf8ff;border-radius:18px;padding:13px 14px;font-size:20px;text-align:left;line-height:1.35;box-shadow:0 4px 0 #eadff7;font-weight:700}
.opt.ok{background:#c9f7d6;border-color:#2fbf71;box-shadow:0 4px 0 #2fbf71;animation:pop .35s}
.opt.bad{background:#ffd3d3;border-color:#e5484d;box-shadow:0 4px 0 #e5484d;animation:shake .35s}
@keyframes pop{50%{transform:scale(1.04)}}
@keyframes shake{25%,75%{transform:translateX(-8px)}50%{transform:translateX(8px)}}
.fb{margin-top:12px;font-weight:900;text-align:center;font-size:19px}
.fb.good{color:#1f9d55}.fb.bad{color:#d9480f}
.nx{display:block;margin:14px auto 0;border:0;border-radius:99px;padding:13px 36px;font-size:20px;font-weight:900;color:#fff;background:linear-gradient(135deg,#7b5cff,#ff4f8b);box-shadow:0 5px 0 rgba(123,92,255,.35)}
.row2{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.row2 .nx{margin:0}
.nx.alt{background:#fff;color:#7b5cff;border:3px solid #ddd2ff;box-shadow:0 5px 0 #eadff7}
.end{text-align:center;background:#fff;border-radius:26px;padding:22px 16px;box-shadow:0 7px 0 #eadff7}
.end .bigem{font-size:70px}
.end h2{margin:4px 0;font-size:27px;color:#7b5cff}
.end .stars{font-size:46px;letter-spacing:4px}
.end .nb{display:inline-block;background:#fff1b8;border-radius:99px;padding:4px 14px;font-weight:900;color:#a86b00;margin-top:6px}

.mh{text-align:center;font-weight:900;color:#6a5f8f;margin:0 0 12px;font-size:18px}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcol{display:flex;flex-direction:column;gap:10px}
.mb{border:3px solid #eadff7;background:#fff;border-radius:16px;padding:13px 8px;font-size:19px;font-weight:800;line-height:1.3;box-shadow:0 4px 0 #eadff7}
.mb.sel{background:#fff1b8;border-color:#ffb703;box-shadow:0 4px 0 #ffb703}
.mb.done{background:#c9f7d6;border-color:#2fbf71;box-shadow:0 4px 0 #2fbf71;opacity:.8}
.mb.bad{background:#ffd3d3;border-color:#e5484d;animation:shake .35s}

.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:16px 0}
.slot{width:44px;height:54px;border-bottom:5px solid #b9a8ff;font-size:32px;font-weight:900;display:flex;align-items:center;justify-content:center;color:#2b2350}
.slot.f{color:#1f9d55;border-color:#2fbf71;animation:pop .3s}
.slot.space{border-bottom-color:transparent;width:18px;color:#b9a8ff}
.tiles{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
.tile{width:56px;height:56px;border:0;border-radius:16px;font-size:30px;font-weight:900;color:#fff;background:linear-gradient(140deg,#ff9f1c,#ff4f8b);box-shadow:0 5px 0 #c2185b}
.tile.used{visibility:hidden}
.tile.bad{background:#e5484d;animation:shake .35s}
.clue{text-align:center;font-size:21px;font-weight:800;margin-top:8px}
.typein{display:block;width:100%;max-width:360px;margin:14px auto 0;font-size:30px;font-weight:900;text-align:center;padding:10px;border:4px solid #b9a8ff;border-radius:18px;font-family:inherit;letter-spacing:2px}
.typein.bad{border-color:#e5484d;animation:shake .35s}
.typein.ok{border-color:#2fbf71;background:#e7fbef}
.modes{display:grid;gap:12px;max-width:420px;margin:10px auto}

.bans{min-height:60px;background:#fff;border:4px dashed #d8ccff;border-radius:18px;padding:10px;margin:14px 0;font-size:21px;font-weight:800;line-height:1.6}
.bans span{background:#c9f7d6;border-radius:10px;padding:2px 8px;margin:2px;display:inline-block}
.btiles{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
.bt{border:3px solid #eadff7;background:#fbf8ff;border-radius:14px;padding:10px 14px;font-size:20px;font-weight:800;box-shadow:0 4px 0 #eadff7}
.bt.bad{background:#ffd3d3;border-color:#e5484d;animation:shake .35s}

.pl{text-align:center}
.pl .e{font-size:76px;line-height:1.1}
.pl .w{font-size:34px;font-weight:900;color:#7b5cff}
.plbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:16px}
.plbtns button{border:0;border-radius:18px;padding:16px 6px;font-size:22px;font-weight:900;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.plbtns button.bad{animation:shake .35s;opacity:.5}

.conf{position:fixed;top:-40px;font-size:30px;pointer-events:none;z-index:60;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(520deg);opacity:.6}}
@media (max-width:560px){.tile{width:48px;height:48px;font-size:26px}.slot{width:36px;font-size:28px}.bigq{font-size:20px}.mb{font-size:17px}}

.la-say{border:0;background:#efeaff;width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer;flex:none;vertical-align:middle;margin-left:6px;box-shadow:0 3px 0 #e3e0f7}
.la-say:active{background:#ffb703}
.la-row{display:flex;gap:8px;align-items:flex-start}


.sumsec{background:#fff;border-radius:24px;padding:14px;margin-bottom:16px;box-shadow:0 6px 0 #eadff7}
.sumtog{width:100%;border:0;background:transparent;text-align:left;font:inherit;font-weight:900;font-size:20px;color:var(--c2);padding:0;cursor:pointer;display:flex;align-items:center;gap:8px}
.sumtog .chev{margin-left:auto;font-size:16px;opacity:.7;transition:transform .2s}
.sumsec.open .sumtog .chev{transform:rotate(90deg)}
.sumhint{font-weight:700;font-size:14px;color:#7a7096}
.sumbody{display:none;margin-top:12px;padding-top:10px;border-top:2px dashed #eadff7;font-size:17px;font-weight:700;line-height:1.55;color:#3a3558}
.sumbody p{margin:0 0 10px}
.sumsec.open .sumbody{display:block}
body.ml{font-family:"Malayalam Sangam MN","Malayalam MN","Noto Sans Malayalam","Avenir Next",system-ui,sans-serif}

 ["sci1-w-injury", "Injury"], ["sci1-w-bandage", "Bandage"], ["sci1-w-footpath", "Footpath"], ["sci1-w-traffic", "Traffic"], ["sci1-w-drainage", "Drainage"], ["sci1-w-mosquitoes", "Mosquitoes"], ["sci1-w-accidents", "Accidents"], ["sci1-w-zebra-crossing", "Zebra crossing"], ["sci1-w-uncovered", "Uncovered"], ["sci1-w-well-lit", "Well-lit"], ["sci1-w-airy", "Airy"], ["sci1-x0", "While walking on the road, we should walk"], ["sci1-x1", "We should cross the road"], ["sci1-x2", "A zebra crossing is used to"], ["sci1-x3", "Toys and bags should not be left on the floor because"], ["sci1-x4", "We need a house because it keeps us safe from"], ["sci1-x5", "A good house should be"], ["sci1-x6", "A good house should have"], ["sci1-x7", "Mosquitoes breed in"], ["sci1-x8", "We should prevent accidents because"], ["sci1-x9", "A bandage is used for an"]]}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const TXT = Object.fromEntries(D.voice);
const CH = Object.fromEntries(D.chapters.map(c => [c.id, c]));
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const S = JSON.parse(localStorage.getItem('joshua-sci-stars-v1') || '{}');
let slow = localStorage.getItem('joshua-sci-slow') === '1';
function award(key, n) {
  const prev = S[key] || 0;
  if (n > prev) { S[key] = n; localStorage.setItem('joshua-sci-stars-v1', JSON.stringify(S)); return true; }
  return false;
}
const starStr = n => '⭐'.repeat(n) + '☆'.repeat(3 - n);

function gameKeys(c) {
  const k = [];
  if (c.meanings.length > 1) k.push('m');
  if (c.opposites.length) k.push('o');
  if (c.quiz.length) k.push('q');
  if (c.qa.length) k.push('b');
  if (c.plurals) k.push('p');
  return k.map(x => c.id + '-' + x);
}
function chStars(c) {
  const keys = gameKeys(c).concat(c.spell.map(([w]) => 'sp-' + w));
  return {got: keys.reduce((s, k) => s + (S[k] || 0), 0), total: keys.length * 3};
}
function allStars() {
  const x = D.chapters.reduce((s, c) => { const y = chStars(c); return {got: s.got + y.got, total: s.total + y.total}; }, {got: 0, total: 0});
  x.got += S['all-q'] || 0; x.total += 3;
  return x;
}
const BADGES = [[0, '🌱', 'Little Scientist'], [0.1, '🐣', 'Rising Star'], [0.3, '🥉', 'Bronze Star'], [0.55, '🥈', 'Silver Star'], [0.8, '🥇', 'Gold Star'], [1, '🏆', 'Science Champion']];
const badgeOf = p => BADGES.filter(b => p >= b[0]).pop();

let sp = null;
let ptok = 0;
const rate = () => slow ? 0.75 : 1;
function stopAudio() {
  ptok++;
  if (sp) {
    try { sp.onended = null; sp.onerror = null; sp.pause(); } catch (e) {}
    sp = null;
  }
  document.querySelectorAll('.playing').forEach(e => e.classList.remove('playing'));
}
function clip(id, mine) {
  return new Promise(res => {
    if (mine !== ptok) return res(false);
    let remote = false;
    sp = new Audio('voice/' + id + '.mp3');
    sp.defaultPlaybackRate = sp.playbackRate = rate();
    sp.onended = () => res(mine === ptok);
    sp.onerror = () => {
      if (mine !== ptok || remote || !TXT[id]) return res(false);
      remote = true;
      sp = new Audio('https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl=en&q=' + encodeURIComponent(TXT[id]));
      sp.defaultPlaybackRate = sp.playbackRate = rate();
      sp.onended = () => res(mine === ptok);
      sp.onerror = () => res(false);
      sp.play().catch(() => res(false));
    };
    sp.play().catch(e => { if (e.name === 'NotAllowedError') res(false); });
  });
}
async function play(ids, el) {
  stopAudio();
  const mine = ptok;
  if (el) el.classList.add('playing');
  for (const id of [].concat(ids)) if (!(await clip(id, mine))) break;
  if (el && mine === ptok) el.classList.remove('playing');
}
function toggleSlow() {
  slow = !slow;
  localStorage.setItem('joshua-sci-slow', slow ? '1' : '0');
  if (sp) { sp.defaultPlaybackRate = sp.playbackRate = rate(); }
  document.querySelectorAll('.slowbtn').forEach(b => b.classList.toggle('on', slow));
}
const slowBtn = () => `<button class="slowbtn ${slow ? 'on' : ''}" onclick="toggleSlow()">🐢 Slow</button>`;

let actx = null;
function tone(fs, d, type, v) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = actx.currentTime;
    fs.forEach((f, k) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + k * d);
      g.gain.exponentialRampToValueAtTime(v, t0 + k * d + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + (k + 1) * d);
      o.connect(g); g.connect(actx.destination);
      o.start(t0 + k * d); o.stop(t0 + (k + 1) * d + 0.05);
    });
  } catch (e) {}
}
const ding = () => tone([660, 880, 1175], 0.1, 'sine', 0.3);
const pip = () => tone([880], 0.08, 'sine', 0.2);
const buzz = () => tone([220, 165], 0.16, 'triangle', 0.3);
function confetti() {
  const em = ['⭐', '🎉', '✨', '🌟', '🎈', '💖', '🍭'];
  for (let i = 0; i < 22; i++) {
    const s = document.createElement('span');
    s.className = 'conf'; s.textContent = em[i % em.length];
    s.style.left = Math.random() * 100 + 'vw'; s.style.animationDelay = Math.random() * 0.4 + 's';
    document.body.appendChild(s); setTimeout(() => s.remove(), 2200);
  }
}
const PRAISE = ['Super! 🌟', 'Well done! 🎉', 'Great job! 💯', 'Awesome! 🚀', 'Yay! You got it! 🥳', 'Fantastic! ✨'];
const praise = () => PRAISE[Math.floor(Math.random() * PRAISE.length)];

let view = {name: 'home'};
function go(v) { stopAudio(); view = v; render(); window.scrollTo(0, 0); }
function render() {
  const c = view.ch ? CH[view.ch] : null;
  document.body.style.setProperty('--c1', c ? c.c1 : '#7b5cff');
  document.body.style.setProperty('--c2', c ? c.c2 : '#ff4f8b');
  if (view.name === 'home') homeView(); else chapterView();
}
function rerender() { const y = window.scrollY; render(); window.scrollTo(0, y); }

const LESSONS = D.chapters.filter(c => !c.grammar), GRAMMAR = [];
function card(c, label) {
  const y = chStars(c);
  return `<button class="ccard" style="--c1:${c.c1};--c2:${c.c2}" onclick="go({name:'ch',ch:'${c.id}',tab:'learn'})">
    <span class="em">${c.emoji}</span><small>${label}</small><h2>${esc(c.title)}</h2>
    <div class="bar"><i style="width:${y.got / y.total * 100}%"></i></div><div class="st">⭐ ${y.got} / ${y.total} stars</div></button>`;
}
function homeView() {
  const x = allStars(), p = x.got / x.total, b = badgeOf(p), nxt = BADGES.find(z => z[0] > p);
  app.innerHTML = `
    <div class="topbar" style="--c1:#00b4d8;--c2:#0077b6"><button class="home" onclick="location.href='../'" title="Home">🏠</button><button class="back" onclick="location.href='../'" title="Back">←</button><b>🔬 Science</b></div>
    <div class="hero"><div class="big">🔬</div><h1>Science Fun</h1><p>Class 3 · Learn · Answer · Play & win stars!</p></div>
    <div class="starbox"><div class="badge">${b[1]}</div><div class="inf">
      <div class="cnt">⭐ ${x.got} / ${x.total}</div><div class="bn">${b[2]}${nxt ? ` · next: ${nxt[1]} ${nxt[2]} at ${Math.ceil(nxt[0] * x.total)} ⭐` : ' · You got every star! 🎉'}</div>
      <div class="bar"><i style="width:${p * 100}%"></i></div></div></div>
    <h2 class="gh">📚 Chapters</h2>
    <div class="cgrid">${LESSONS.map((c, i) => card(c, 'Lesson ' + (i + 1))).join('')}</div>
    <div class="quick">
      <button class="qbtn" style="--b:linear-gradient(135deg,#ff9f1c,#ff4f8b)" onclick="startQuiz(null)">🏆 Big Quiz<small>All lessons · ${starStr(S['all-q'] || 0)}</small></button>
      <button class="qbtn" style="--b:linear-gradient(135deg,#2ec4b6,#3a86ff)" onclick="startSpell(null)">✍️ Spelling Bee<small>All tough spellings</small></button>
      <button class="qbtn" style="--b:linear-gradient(135deg,#8338ec,#3a0ca3)" onclick="startBuild(null)">🧩 Build Answers<small>All lessons</small></button>
      
    </div>
    <p class="foot">Tip: finish every game with ⭐⭐⭐ to become the English Champion 🏆 · Bookmark this page: <b>.../english/</b></p>`;
}

function sumSec(c) {
  if (!c.summary || !c.summary.length) return '';
  const paras = (Array.isArray(c.summary) ? c.summary : [c.summary]).map(p => `<p>${esc(p)}</p>`).join('');
  return `<div class="sec sumsec" id="sumsec">
    <button type="button" class="sumtog" onclick="toggleSum()"><span>📄 ${esc(c.sumTitle || 'Summary')}</span><span class="sumhint" id="sumhint">· tap to open</span><span class="chev">▶</span></button>
    <div class="sumbody">${paras}</div>
  </div>`;
}
function toggleSum() {
  const box = document.getElementById('sumsec');
  if (!box) return;
  box.classList.toggle('open');
  const h = document.getElementById('sumhint');
  if (h) h.textContent = box.classList.contains('open') ? '· tap to close' : '· tap to open';
}
function chapterView() {
  const c = CH[view.ch], y = chStars(c);
  let body;
  const pluralGrid = () => `<div class="wgrid">
        ${c.plurals.map(([s, p, e], k) => `<button class="wcard" onclick="play('${c.pA[k]}',this)"><div class="e">${e}</div><div class="m">one <b>${esc(s)}</b></div><div class="e" style="font-size:30px">${e}${e}${e}</div><div class="m">many <b>${esc(p)}</b></div></button>`).join('')}</div>`;
  const spellSec = () => c.spell.length ? `<div class="sec"><h3>✍️ Tough Spellings</h3><p class="hint">Tap a word to hear it. Practise them in the Spelling Bee game!</p>
        <div class="spl">${c.spell.map(([w, , vid]) => `<button onclick="play('${vid || ('e-w-' + w)}',this)">${esc(w)}<small>${'⭐'.repeat(S['sp-' + w] || 0)}</small></button>`).join('')}</div></div>` : '';
  const meanSec = () => c.meanings && c.meanings.length ? `<div class="sec"><h3>📖 ${esc(c.mTitle || 'Word Meanings')}</h3><p class="hint">Tap a card to hear it.</p><div class="wgrid">
        ${c.meanings.map(([w, m, e], k) => `<button class="wcard" onclick="play('${c.mA[k]}',this)"><div class="e">${e}</div><div class="w">${esc(w)}</div><div class="m">means <b>${esc(m)}</b></div></button>`).join('')}</div></div>` : '';
  const oppSec = () => c.opposites && c.opposites.length ? `<div class="sec"><h3>↔️ ${esc(c.oTitle || 'Opposites')}</h3><p class="hint">Tap to hear.</p>
        ${c.opposites.map(([a, b, ea, eb], k) => `<button class="opp" onclick="play('${c.oA[k]}',this)"><div><span>${ea}</span>${esc(a)}</div><div class="ar">⇄</div><div><span>${eb}</span>${esc(b)}</div></button>`).join('')}</div>` : '';
  const qaSec = () => c.qa && c.qa.length ? `<div class="sec"><h3>❓ Questions and Answers</h3><p class="hint">Read the question, say your answer, then tap "Show answer".</p>
        ${c.qa.map(([q, a], k) => `<div class="qa" id="qa${k}"><div class="q"><span>${k + 1}. ${esc(q)}</span><button class="say" onclick="play('${c.qA[k]}',this)">🔊</button></div>
          <div id="ans${k}" style="display:none"><div class="ans"><span>${esc(a)}</span><button class="say" onclick="play('${c.aA[k]}',this)">🔊</button></div>
          ${c.family && k === 0 ? `<div class="fam">${c.family.map(([n, e], i) => `<div><span>${e}</span>${n}<i>${i + 1}</i></div>`).join('')}</div>` : ''}</div>
          <button class="show" id="sh${k}" onclick="showAns(${k})">👀 Show answer</button></div>`).join('')}</div>` : '';
  const learnSecs = () => (c.learn || []).map(sec => `<div class="sec"><h3>${esc(sec.h)}</h3>
        ${sec.rows.map(([e, t], k) => `<button class="grow" onclick="play('${sec.ids[k]}',this)"><span class="ge">${e}</span><span class="gtx">${esc(t)}</span></button>`).join('')}</div>`).join('');
  if (view.tab === 'learn' && c.grammar) {
    body = learnSecs() + meanSec() + oppSec() + qaSec() +
      (c.plurals ? `<div class="sec"><h3>🍎 Tap to hear: one and many</h3>${pluralGrid()}</div>` : '') + spellSec() +
      `<button class="nx" onclick="go({name:'ch',ch:'${c.id}',tab:'play'})">🎮 Let's practise!</button>`;
  } else if (view.tab === 'learn') {
    body = learnSecs() + meanSec() + oppSec() +
      (c.plurals ? `<div class="sec"><h3>🍎 One and Many (Plurals)</h3>
        <div class="rules">
          <div style="background:#e3f2ff"><b>+ s</b> · bottle → bottle<u>s</u></div>
          <div style="background:#fff0d9"><b>+ es</b> after s, ss, x · bus → bus<u>es</u>, dress → dress<u>es</u>, fox → fox<u>es</u></div>
          <div style="background:#ffe3ef"><b>y → ies</b> · copy → cop<u>ies</u>, lady → lad<u>ies</u>, baby → bab<u>ies</u></div>
        </div>${pluralGrid()}</div>` : '') +
      qaSec() + spellSec() + sumSec(c) +
      `<button class="nx" onclick="go({name:'ch',ch:'${c.id}',tab:'play'})">🎮 Let's play!</button>`;
  } else {
    const tile = (bg, i, t, sub, key, fn) => `<button class="gt" style="--b:${bg}" onclick="${fn}"><span class="i">${i}</span><b>${t}</b><small>${sub}</small>${key ? `<span class="s">${starStr(S[key] || 0)}</span>` : ''}</button>`;
    const sg = c.spell.reduce((s, [w]) => s + (S['sp-' + w] || 0), 0);
    body = `<div class="gtiles">
      ${c.quiz.length ? tile('linear-gradient(135deg,#ff4f8b,#c2185b)', '🎯', 'Quiz', `${c.quiz.length} questions`, c.id + '-q', `startQuiz('${c.id}')`) : ''}
      ${c.qa.length ? tile('linear-gradient(135deg,#2ec4b6,#118ab2)', '🧩', c.grammar ? 'Build the Sentence' : 'Build the Answer', c.grammar ? `${c.qa.length} sentences to make` : 'Put the answer words in order', c.id + '-b', `startBuild('${c.id}')`) : ''}
      ${c.meanings.length > 1 ? tile('linear-gradient(135deg,#3a86ff,#8338ec)', '🔗', c.mTitle || 'Match the Meanings', 'Word ⇄ meaning', c.id + '-m', `startMatch('${c.id}','m')`) : ''}
      ${c.opposites.length ? tile('linear-gradient(135deg,#ff9f1c,#e76f51)', '↔️', c.oTitle ? (c.oTitle + ' Match') : 'Opposite Match', c.oTitle ? 'Word ⇄ synonym' : 'Word ⇄ opposite', c.id + '-o', `startMatch('${c.id}','o')`) : ''}
      ${c.plurals ? tile('linear-gradient(135deg,#80b918,#2b9348)', '🍎', 'One and Many', c.grammar ? 's, es, ies, ves or special?' : 's, es or ies?', c.id + '-p', `startPlural('${c.id}')`) : ''}
      ${c.spell.length ? tile((c.id === 'g9' || c.dictation) ? 'linear-gradient(135deg,#e63946,#9d0208)' : 'linear-gradient(135deg,#8338ec,#3a0ca3)', (c.id === 'g9' || c.dictation) ? '📝' : '✍️', (c.id === 'g9' || c.dictation) ? 'Dictation' : 'Spelling Bee', `${c.spell.length} words · ⭐ ${sg}/${c.spell.length * 3}`, '', `startSpell('${c.id}')`) : ''}
    </div>`;
  }
  app.innerHTML = `<div class="topbar"><button class="home" onclick="location.href='../'" title="Home">🏠</button><button class="back" onclick="go({name:'home'})" title="Back">←</button><b>${c.emoji} ${esc(c.title)}</b><span class="chip">⭐ ${y.got}/${y.total}</span>${slowBtn()}</div>
    <div class="tabs"><button class="tab ${view.tab === 'learn' ? 'on' : ''}" onclick="go({name:'ch',ch:'${c.id}',tab:'learn'})">📖 Learn</button>
    <button class="tab ${view.tab === 'play' ? 'on' : ''}" onclick="go({name:'ch',ch:'${c.id}',tab:'play'})">🎮 Play & Win ⭐</button></div>${body}`;
}
function showAns(k) {
  const c = CH[view.ch];
  document.getElementById('ans' + k).style.display = '';
  document.getElementById('sh' + k).style.display = 'none';
  play(c.aA[k], document.querySelector('#ans' + k + ' .say'));
}

const ov = document.getElementById('ov'), ovb = () => document.getElementById('ovb');
let G = null;
function openOv(title, c) {
  stopAudio();
  ov.style.setProperty('--c1', c ? c.c1 : '#7b5cff');
  ov.style.setProperty('--c2', c ? c.c2 : '#ff4f8b');
  document.getElementById('ovt').textContent = title;
  setScore('');
  ov.classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeOv() { stopAudio(); ov.classList.remove('show'); document.body.style.overflow = ''; G = null; rerender(); }
const setScore = t => document.getElementById('ovs').innerHTML = t;
const stars3 = (mistakes, ok1, ok2) => mistakes <= ok1 ? 3 : mistakes <= ok2 ? 2 : 1;
function endScreen(stars, key, msg, again, extra) {
  const nb = key ? award(key, stars) : false;
  confetti(); ding();
  ovb().innerHTML = `<div class="end"><div class="bigem">${stars === 3 ? '🏆' : stars === 2 ? '🥳' : '💪'}</div>
    <h2>${msg}</h2><div class="stars">${starStr(stars)}</div>${nb ? '<div class="nb">🎉 New best!</div>' : ''}
    ${extra || ''}
    <div class="row2"><button class="nx" onclick="${again}">🔁 Play again</button><button class="nx alt" onclick="closeOv()">✕ Close</button></div></div>`;
}

function startMatch(cid, kind) {
  const c = CH[cid];
  const pairs = shuffle((kind === 'm' ? c.meanings.map(([w, m, e]) => [(e + ' ' + w).trim(), m]) : c.opposites.map(([a, b, ea, eb]) => [(ea + ' ' + a).trim(), (eb + ' ' + b).trim()])).map((p, i) => ({l: p[0], r: p[1], i})));
  G = {cid, kind, pairs, done: 0, sel: null, mistakes: 0};
  openOv(kind === 'm' ? '🔗 ' + (c.mTitle || 'Match the Meanings') : '↔️ Opposite Match', c);
  ovb().innerHTML = `<p class="mh">Tap a word, then tap its ${kind === 'o' ? 'opposite' : c.mTitle ? 'partner' : 'meaning'} 👆</p><div class="mcols">
    <div class="mcol">${shuffle(pairs).map(p => `<button class="mb" data-i="${p.i}" onclick="pickL(this)">${esc(p.l)}</button>`).join('')}</div>
    <div class="mcol">${shuffle(pairs).map(p => `<button class="mb" data-i="${p.i}" onclick="pickR(this)">${esc(p.r)}</button>`).join('')}</div></div>`;
}
function pickL(b) {
  if (b.classList.contains('done')) return;
  document.querySelectorAll('.mcol:first-child .mb').forEach(x => x.classList.remove('sel'));
  b.classList.add('sel'); G.sel = b; pip();
}
function pickR(b) {
  if (b.classList.contains('done')) return;
  if (!G.sel) { b.classList.add('bad'); setTimeout(() => b.classList.remove('bad'), 400); return; }
  if (b.dataset.i === G.sel.dataset.i) {
    [b, G.sel].forEach(x => { x.classList.remove('sel'); x.classList.add('done'); });
    const c = CH[G.cid], i = +b.dataset.i;
    play((G.kind === 'm' ? c.mA : c.oA)[i]);
    G.sel = null; G.done++; ding();
    if (G.done === G.pairs.length) setTimeout(() => endScreen(stars3(G.mistakes, 0, 2), G.cid + '-' + G.kind, 'All matched!', `startMatch('${G.cid}','${G.kind}')`, `<p>Mistakes: <b>${G.mistakes}</b></p>`), 1400);
  } else {
    const s = G.sel; [b, s].forEach(x => x.classList.add('bad'));
    setTimeout(() => { b.classList.remove('bad'); s.classList.remove('bad'); }, 400);
    G.mistakes++; buzz();
  }
}

const KCOL = {Meaning: '#3a86ff', Opposite: '#ff9f1c', Plural: '#2b9348', Question: '#ff4f8b'};
function startQuiz(cid) {
  const list = cid ? CH[cid].quiz.map(q => ({...q, c: CH[cid]})) : LESSONS.flatMap(c => c.quiz.map(q => ({...q, c})));
  G = {cid, queue: shuffle(list), total: list.length, learned: 0, first: 0, missed: new Set()};
  openOv(cid ? '🎯 Quiz' : '🏆 Big Quiz', cid ? CH[cid] : null);
  showQ();
}
function showQ() {
  if (!G.queue.length) {
    const s = G.first === G.total ? 3 : G.first >= G.total * 0.7 ? 2 : 1;
    return endScreen(s, G.cid ? G.cid + '-q' : 'all-q', G.first === G.total ? 'Perfect! All correct!' : 'Quiz complete!', `startQuiz(${G.cid ? `'${G.cid}'` : 'null'})`, `<p style="font-size:18px">${G.first} of ${G.total} correct on the first try</p>`);
  }
  const q = G.queue[0];
  G.opts = q.opts.length === 2 ? q.opts : shuffle(q.opts); G.answered = false;
  setScore(`✅ ${G.learned}/${G.total}`);
  ovb().innerHTML = `<div class="prog"><div class="bar"><i style="width:${G.learned / G.total * 100}%"></i></div><span>${G.learned}/${G.total}</span></div>
    <div class="card"><span class="kind" style="--k:${KCOL[q.kind] || q.c.c1}">${q.kind}</span>${G.cid ? '' : ` <span class="kind" style="--k:${q.c.c1}">${q.c.emoji} ${esc(q.c.title)}</span>`}
      <div class="bigq"><span>${esc(q.q).replace(/_{3,}/g, '<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>')}</span><button class="say" onclick="play('${q.id}',this)">🔊</button></div>
      <div class="opts">${G.opts.map((o, k) => `<button class="opt" onclick="answer(this,${k})">${esc(o)}</button>`).join('')}</div><div id="after"></div></div>`;
  play(q.id);
}
function answer(btn, k) {
  if (G.answered) return;
  G.answered = true;
  const q = G.queue.shift(), btns = [...document.querySelectorAll('.opt')];
  btns.forEach(b => b.disabled = true);
  let fb;
  if (G.opts[k] === q.a) {
    btn.classList.add('ok'); ding(); confetti();
    G.learned++; if (!G.missed.has(q.id)) G.first++;
    fb = `<div class="fb good">${praise()}</div>`;
  } else {
    btn.classList.add('bad'); buzz();
    btns.forEach((b, j) => { if (G.opts[j] === q.a) b.classList.add('ok'); });
    G.missed.add(q.id);
    G.queue.splice(Math.min(G.queue.length, 2 + Math.floor(Math.random() * 3)), 0, q);
    fb = `<div class="fb bad">Oops! The green one is right. You'll get this one again 🔁</div>`;
  }
  setScore(`✅ ${G.learned}/${G.total}`);
  document.getElementById('after').innerHTML = fb + `<button class="nx" onclick="showQ()">Next ➜</button>`;
}

function chunkAnswer(a, perWord) {
  const w = a.split(' '), size = perWord && w.length <= 10 ? 1 : Math.ceil(w.length / 7), out = [];
  for (let i = 0; i < w.length; i += size) out.push(w.slice(i, i + size).join(' '));
  return out;
}
function startBuild(cid) {
  const items = (cid ? [CH[cid]] : LESSONS).flatMap(c => c.qa.map(([q, a], k) => ({c, q, a, qid: c.qA[k], aid: c.aA[k]})));
  G = {cid, items: cid ? items : shuffle(items), i: 0, mistakes: 0, tiles: 0};
  openOv(cid && CH[cid].grammar ? '🧩 Build the Sentence' : '🧩 Build the Answer', cid ? CH[cid] : null);
  showBuild();
}
function showBuild() {
  if (G.i >= G.items.length) {
    const s = stars3(G.mistakes / G.tiles, 0, 0.2);
    return endScreen(s, G.cid ? G.cid + '-b' : '', 'You built them all!', `startBuild(${G.cid ? `'${G.cid}'` : 'null'})`, `<p>Mistakes: <b>${G.mistakes}</b></p>`);
  }
  const it = G.items[G.i];
  G.parts = chunkAnswer(it.a, it.c.grammar); G.pos = 0; G.tiles += G.parts.length;
  setScore(`${G.i + 1}/${G.items.length}`);
  ovb().innerHTML = `<div class="card"><div class="bigq"><span>${esc(it.q)}</span><button class="say" onclick="play('${it.qid}',this)">🔊</button></div>
    <p class="mh" style="margin-top:10px">Tap the ${it.c.grammar ? 'words in the right order to make the sentence' : 'pieces in the right order to write the answer'} ✍️</p>
    <div class="bans" id="bans"></div>
    <div class="btiles">${shuffle(G.parts.map((p, i) => ({p, i}))).map(x => `<button class="bt" data-p="${esc(x.p)}" onclick="pickB(this)">${esc(x.p)}</button>`).join('')}</div><div id="after"></div></div>`;
  play(it.qid);
}
function pickB(b) {
  if (b.dataset.p === G.parts[G.pos]) {
    G.pos++; pip();
    document.getElementById('bans').insertAdjacentHTML('beforeend', `<span>${esc(b.dataset.p)}</span> `);
    b.remove();
    if (G.pos === G.parts.length) {
      ding(); confetti();
      play(G.items[G.i].aid);
      document.getElementById('after').innerHTML = `<div class="fb good">${praise()}</div><button class="nx" onclick="G.i++;showBuild()">Next ➜</button>`;
    }
  } else {
    G.mistakes++; buzz();
    b.classList.add('bad'); setTimeout(() => b.classList.remove('bad'), 400);
  }
}

const PRULES = [['+ s', '#3a86ff'], ['+ es', '#ff9f1c'], ['y → ies', '#ff4f8b'], ['f → ves', '#2b9348'], ['special', '#8338ec']];
function startPlural(cid) {
  const c = CH[cid];
  const rules = [...new Set(c.plurals.map(x => x[3]))].sort();
  G = {cid, rules, items: shuffle(c.plurals.map((x, k) => [...x, c.pA[k]])).slice(0, 15), i: 0, mistakes: 0};
  openOv('🍎 One and Many', c);
  showPlural();
}
function showPlural() {
  if (G.i >= G.items.length) return endScreen(stars3(G.mistakes, 0, 2), G.cid + '-p', 'Plural pro!', `startPlural('${G.cid}')`, `<p>Mistakes: <b>${G.mistakes}</b></p>`);
  const [s, , e] = G.items[G.i];
  setScore(`${G.i + 1}/${G.items.length}`);
  ovb().innerHTML = `<div class="card pl"><div class="e">${e}</div><div class="w">one ${esc(s)}</div>
    <p class="mh">How do we say many? 🤔</p>
    <div class="plbtns">${G.rules.map(r => `<button style="background:${PRULES[r][1]}" onclick="pickPl(this,${r})">${PRULES[r][0]}</button>`).join('')}</div>
    <div id="after"></div></div>`;
}
function pickPl(b, r) {
  const [s, p, e, rule, aid] = G.items[G.i];
  if (G.done === G.i) return;
  if (r === rule) {
    G.done = G.i; ding(); confetti(); play(aid);
    document.getElementById('after').innerHTML = `<div class="e" style="font-size:44px;margin-top:12px">${e}${e}${e}</div><div class="w">many ${esc(p)}</div><div class="fb good">${praise()}</div><button class="nx" onclick="G.i++;showPlural()">Next ➜</button>`;
  } else {
    G.mistakes++; buzz(); b.classList.add('bad');
  }
}

function startSpell(cid) {
  const c = cid ? CH[cid] : null;
  const words = (cid ? [c] : D.chapters).flatMap(ch => (ch.spell || []).map(([w, clue, vid]) => ({w, clue, vid: vid || ('e-w-' + w), c: ch}))).filter(x => x.w);
  const dictation = !!(c && (c.id === 'g9' || c.dictation));
  G = {cid, words: shuffle(words), i: 0, got: 0, mode: 'tiles', dictation};
  openOv(dictation ? '📝 Dictation' : '✍️ Spelling Bee', c);
  showSpell();
}
function showSpell() {
  if (G.i >= G.words.length) {
    const max = G.words.length * 3, s = G.got === max ? 3 : G.got >= max * 0.7 ? 2 : 1;
    return endScreen(s, '', G.dictation ? 'Dictation practise done!' : 'Spelling Bee done!', `startSpell(${G.cid ? `'${G.cid}'` : 'null'})`, `<p style="font-size:19px">You won <b>${G.got}</b> of ${max} ⭐ this round</p>`);
  }
  const x = G.words[G.i];
  G.pos = 0; G.miss = 0; G.fin = false;
  G.mode = 'tiles';
  setScore(`${G.i + 1}/${G.words.length} · ⭐ ${G.got}`);
  const needed = x.w.split('').filter(l => l !== ' ');
  let letters = needed.slice();
  do { letters = shuffle(letters); } while (letters.join('') === needed.join('') && needed.length > 1);
  ovb().innerHTML = `<div class="card" style="text-align:center">
    <button class="say" style="width:70px;height:70px;font-size:32px" onclick="play('${x.vid}',this)">🔊</button>
    <div class="clue">${G.dictation ? '👂 Listen · tap letters · one word' : '💡 ' + esc(x.clue)}</div>
    <div class="slots">${x.w.split('').map((ch, i) => `<div class="slot${ch === ' ' ? ' space' : ''}" id="sl${i}">${ch === ' ' ? '·' : ''}</div>`).join('')}</div>
    <div class="tiles">${letters.map(l => `<button class="tile" data-l="${l}" onclick="pickT(this)">${esc(l)}</button>`).join('')}</div>
    <div class="row2"><button class="nx alt" onclick="spellHint()">💡 Help me</button></div>
    <div id="after"></div></div>`;
  play(x.vid);
}
function fillSlot(i, l) { const s = document.getElementById('sl' + i); s.textContent = l; s.classList.add('f'); }
function nextSpellPos(w, p) { while (p < w.length && w[p] === ' ') { fillSlot(p, '·'); p++; } return p; }
function pickT(b) {
  if (G.fin) return;
  const w = G.words[G.i].w;
  G.pos = nextSpellPos(w, G.pos);
  if (b.dataset.l.toLowerCase() === w[G.pos].toLowerCase()) {
    fillSlot(G.pos, w[G.pos]); G.pos = nextSpellPos(w, G.pos + 1); b.classList.add('used'); pip();
    if (G.pos >= w.length) spellDone();
  } else {
    G.miss++; buzz(); b.classList.add('bad'); setTimeout(() => b.classList.remove('bad'), 400);
  }
}
function spellHint() {
  if (G.fin) return;
  const w = G.words[G.i].w;
  G.miss += 1;
  G.pos = nextSpellPos(w, G.pos);
  if (G.mode === 'tiles') {
    const t = [...document.querySelectorAll('.tile:not(.used)')].find(t => t.dataset.l === w[G.pos]);
    if (t) pickT(t);
  } else {
    let n = Math.min(w.length, Math.max(G.pos, 0) + 1);
    while (n < w.length && w[n] === ' ') n++;
    G.pos = n;
    for (let i = 0; i < n; i++) fillSlot(i, w[i] === ' ' ? '·' : w[i]);
    const inp = document.getElementById('tin'); inp.value = w.slice(0, n); inp.focus();
    if (n >= w.length) spellDone();
  }
}
function checkType() {
  if (G.fin) return;
  const w = G.words[G.i].w, inp = document.getElementById('tin'), v = inp.value.trim().toLowerCase().replace(/\s+/g, ' ');
  if (v === w.toLowerCase()) { w.split('').forEach((l, i) => fillSlot(i, l === ' ' ? '·' : l)); inp.classList.add('ok'); spellDone(); }
  else {
    G.miss++; buzz(); inp.classList.add('bad'); setTimeout(() => inp.classList.remove('bad'), 400);
    let k = 0; while (k < v.length && v[k] === w[k]) k++;
    document.getElementById('after').innerHTML = `<div class="fb bad">Not yet! ${k ? `The first ${k} letter${k > 1 ? 's are' : ' is'} right. ` : ''}Try again 💪</div>`;
  }
}
function spellDone() {
  G.fin = true;
  const x = G.words[G.i], s = stars3(G.miss, 0, 2);
  G.got += s;
  const nb = award('sp-' + x.w, s);
  setScore(`${G.i + 1}/${G.words.length} · ⭐ ${G.got}`);
  ding(); if (s === 3) confetti();
  play(x.vid);
  document.getElementById('after').innerHTML = `<div class="stars" style="font-size:38px;margin-top:10px">${starStr(s)}</div>
    <div class="fb good">${s === 3 ? praise() : 'Good try! Practise once more to get ⭐⭐⭐'}${nb ? ' · New best!' : ''}</div>
    <button class="nx" onclick="G.i++;showSpell()">Next ➜</button>`;
}

render();
</script>
</body>
</html>
