.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}

.say.playing,.say:active{background:#ffb703;transform:scale(.96)}
.say.sm{width:48px;height:48px;font-size:22px;margin:0 4px;vertical-align:middle}
.qtext{font-size:20px;font-weight:800;margin:10px 0;color:#1f2340;display:flex;gap:8px;align-items:flex-start;justify-content:center;text-align:left}
.opts{display:grid;gap:10px;margin-top:12px;text-align:left}
.opt{border:2px solid #f0d9c8;background:#fff8f2;border-radius:16px;padding:14px;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 4px 0 #f0d9c8;width:100%;display:flex;align-items:center;gap:8px}

.fb{margin-top:12px;font-weight:800;font-size:18px}.fb.good{color:#1f9d55}.fb.bad{color:#d9480f}

.prog{font-weight:800;color:#5b5f86;margin-bottom:8px}

","Only at night"],"a":0,"qVid":"v-b80174b6ad","oVids":["v-f36b1dd0c2","v-bafd7322c6","v-78ea84d886"],"aVid":"v-8b90dafc49"}],"titleVid":"v-be106df2e5","blurbVid":"v-c34d466b42"},{"id":"quizmix","title":"Brainy Quiz","emoji":"🧠","grad":"linear-gradient(135deg,#7209b7,#f72585)","blurb":"Mixed GK from your book","learn":[{"em":"🪶","t":"Feathers","s":"All birds have feathers. No other animal has feathers.","vid":"v-4ebe3bdcd3","titleVid":"v-2f332fd601"},{"em":"💎","t":"Diamond","s":"Diamond is the hardest material in the world.","vid":"v-b66d9698ef","titleVid":"v-8f7671185d"},{"em":"📖","t":"Dictionary","s":"A dictionary has an alphabetical list of words and their meanings.","vid":"v-4e84324366","titleVid":"v-3beb75d156"},{"em":"🦁","t":"Gir lions","s":"Lions are found in the Gir National Park in India.","vid":"v-f769b0f08f","titleVid":"v-8ecea9a080"},{"em":"🕺","t":"Bhangra","s":"Bhangra is a folk dance from Punjab.","vid":"v-aa5a4ee166","titleVid":"v-186843be35"},{"em":"🍬","t":"Gulab jamun","s":"Gulab jamun is a very tasty Indian sweet.","vid":"v-72c1e7605e","titleVid":"v-e8a12e9588"},{"em":"🇮🇳","t":"Nehru","s":"Jawaharlal Nehru was the first Prime Minister of India.","vid":"v-66be8e667f","titleVid":"v-5f21fa7c17"},{"em":"❤️","t":"Love grandparents","s":"We can make grandparents happy by helping them — finding spectacles, sharing fruit, making a card, or asking for a story.","vid":"v-7c98f53f6d","titleVid":"v-48e0d2c341"}],"quiz":[{"q":"All birds have them. No other animal has them.","o":["Feathers","Coat","Fins"],"a":0,"qVid":"v-3faf6632e0","oVids":["v-2f332fd601","v-6e162ed9a2","v-3ad8d97824"],"aVid":"v-a1d96d5482"},{"q":"Hardest material in the world?","o":["Gold","Diamond","Wood"],"a":1,"qVid":"v-6b6086cbb8","oVids":["v-9768feb3fd","v-8f7671185d","v-6e4dd7ce4e"],"aVid":"v-5847c62446"},{"q":"Book with words and meanings in A to Z order?","o":["Atlas","Dictionary","Comic"],"a":1,"qVid":"v-a8275be1e3","oVids":["v-a6567816e0","v-3beb75d156","v-3ed856bcf8"],"aVid":"v-a2e16af1bd"},{"q":"Animal found in Gir National Park?","o":["Penguin","Lion","Kangaroo"],"a":1,"qVid":"v-2f2833eaef","oVids":["v-99625fa1ca","v-60d28e7d87","v-9b4e21b488"],"aVid":"v-b385472460"},{"q":"Folk dance from Punjab?","o":["Bhangra","Bharatanatyam","Kathakali"],"a":0,"qVid":"v-5e95865d49","oVids":["v-186843be35","v-a1b02bb0d8","v-798c19b180"],"aVid":"v-2a9d4a67d1"},{"q":"First Prime Minister of India?","o":["Jawaharlal Nehru","Harry Potter","Tintin"],"a":0,"qVid":"v-2773b7d0ed","oVids":["v-8c5e82f718","v-6eb2dc222c","v-bb378a544f"],"aVid":"v-8891dd4c4a"},{"q":"Hedwig was Harry Potter's pet owl.","o":["True","False","Maybe"],"a":0,"qVid":"v-a786ed1346","oVids":["v-f827cf462f","v-f8320b26d3","v-80ba31cc9d"],"aVid":"v-403f02925f"},{"q":"A toucan has a white beak.","o":["True","False","Always"],"a":1,"qVid":"v-f96c994061","oVids":["v-f827cf462f","v-f8320b26d3","v-68eec46437"],"aVid":"v-5fdc5b578f"}],"titleVid":"v-6f40dceffa","blurbVid":"v-240d779661"},{"id":"logic","title":"Figure It Out","emoji":"🔢","grad":"linear-gradient(135deg,#ffd60a,#f77f00)","blurb":"Patterns, codes & odd one out","learn":[{"em":"7️⃣","t":"Number series","s":"In 7, 14, 21, each number goes up by 7. So next is 28.","vid":"v-580f6e498b","titleVid":"v-6232574a09"},{"em":"➖","t":"Count down","s":"In 65, 52, 39, each number goes down by 13. So next is 26.","vid":"v-08a1f23211","titleVid":"v-f9b239cf08"},{"em":"🔤","t":"Letter code","s":"If A is 1, B is 2, C is 3 and D is 4, then D C is 4 3. And 4 2 3 is D B C.","vid":"v-e9dc5a26be","titleVid":"v-cf30c984e9"},{"em":"🧩","t":"Odd one out","s":"Look for the one that does not belong. Rivers are Ganga, Narmada, Kaveri — Vindhya is a mountain range, so it is odd.","vid":"v-131aa7a74c","titleVid":"v-eb61239529"}],"quiz":[{"q":"Series: 7, 14, 21, ? What comes next?","o":["24","28","30"],"a":1,"qVid":"v-ffad2247b0","oVids":["v-1ff1de7740","v-33e75ff09d","v-34173cb38f"],"aVid":"v-0e535510ca"},{"q":"Series: 65, 52, 39, ? What comes next?","o":["26","30","13"],"a":0,"qVid":"v-db5358459f","oVids":["v-4e732ced34","v-34173cb38f","v-c51ce410c1"],"aVid":"v-a643870ad6"},{"q":"If A=1, B=2, C=3, D=4 — write 423 in letters.","o":["DBC","ABC","CBA"],"a":0,"qVid":"v-dcfe03f7aa","oVids":["v-1356e30339","v-902fbdd2b1","v-a61a40943e"],"aVid":"v-01fa75a8a0"},{"q":"If A=1…D=4 — write BADC in figures.","o":["2143","1234","4321"],"a":0,"qVid":"v-11187e8c8b","oVids":["v-9f44e956e3","v-81dc9bdb52","v-d93591bdf7"],"aVid":"v-7e6e2bd0a7"},{"q":"Odd one out: Batman, Human, Spiderman, Superman","o":["Batman","Human","Superman"],"a":1,"qVid":"v-68fd36bb35","oVids":["v-4a4566696c","v-c1bb19b278","v-527d60cd47"],"aVid":"v-44a11386cc"},{"q":"Odd one out: Vindhya, Ganga, Narmada, Kaveri","o":["Vindhya","Ganga","Kaveri"],"a":0,"qVid":"v-7b90adc4c2","oVids":["v-b1b157c306","v-910ab001c3","v-059dc191f6"],"aVid":"v-d9570ea69d"},{"q":"Odd one out: Cow, sheep, horse, deer","o":["Cow","Deer","Horse"],"a":1,"qVid":"v-79ac04d757","oVids":["v-fe0707cc47","v-529ab9b63e","v-38069b4eb6"],"aVid":"v-ea07473652"}],"titleVid":"v-be21f8236b","blurbVid":"v-7c211e3db3"}]}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const TOPICS = D.topics;
const SKEY = 'joshua-gk-v1';
let S = JSON.parse(localStorage.getItem(SKEY) || '{}');
const save = () => localStorage.setItem(SKEY, JSON.stringify(S));
const app = document.getElementById('app');
const ov = document.getElementById('ov');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

let sp = null, ptok = 0;
function stopAudio() {
  ptok++;
  if (sp) { try { sp.onended = null; sp.onerror = null; sp.pause(); } catch (e) {} sp = null; }
  try { if (window.LearnAudio) LearnAudio.stop(); } catch (e) {}
  document.querySelectorAll('.playing').forEach(e => e.classList.remove('playing'));
}
/** Fresh Audio each click — local mp3 first, then online TTS fallback. */
function say(vidOrText, el) {
  stopAudio();
  const mine = ptok;
  if (el) el.classList.add('playing');
  const isVid = typeof vidOrText === 'string' && /^v-[a-f0-9]+$/.test(vidOrText);
  const text = isVid ? null : String(vidOrText || '');
  const url = isVid ? ('voice/' + vidOrText + '.mp3') : null;

  const playUrl = (src, remoteText) => new Promise(res => {
    sp = new Audio(src);
    sp.playbackRate = 0.95;
    sp.onended = () => { if (el && mine === ptok) el.classList.remove('playing'); res(mine === ptok); };
    sp.onerror = () => {
      if (mine !== ptok) return res(false);
      if (remoteText && window.LearnAudio) {
        LearnAudio.speak(remoteText, 'en-IN', 0.92, el).then(ok => res(!!ok));
      } else if (remoteText) {
        const g = 'https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl=en&q=' + encodeURIComponent(remoteText.slice(0, 180));
        sp = new Audio(g);
        sp.onended = () => { if (el && mine === ptok) el.classList.remove('playing'); res(mine === ptok); };
        sp.onerror = () => { if (el && mine === ptok) el.classList.remove('playing'); res(false); };
        sp.play().catch(() => { if (el && mine === ptok) el.classList.remove('playing'); res(false); });
      } else {
        if (el && mine === ptok) el.classList.remove('playing');
        res(false);
      }
    };
    sp.play().catch(() => { if (el && mine === ptok) el.classList.remove('playing'); res(false); });
  });

  if (url) return playUrl(url, null);
  if (window.LearnAudio) return LearnAudio.speak(text, 'en-IN', 0.92, el);
  return playUrl('https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl=en&q=' + encodeURIComponent(text.slice(0, 180)), text);
}
function sayVid(vid, text, el) {
  // Prefer local vid; keep text for fallback via LearnAudio path inside onerror — patch:
  stopAudio();
  const mine = ptok;
  if (el) el.classList.add('playing');
  if (!vid) return say(text, el);
  sp = new Audio('voice/' + vid + '.mp3');
  sp.playbackRate = 0.95;
  return new Promise(res => {
    sp.onended = () => { if (el && mine === ptok) el.classList.remove('playing'); res(mine === ptok); };
    sp.onerror = () => {
      if (mine !== ptok) return res(false);
      if (window.LearnAudio) return LearnAudio.speak(text || '', 'en-IN', 0.92, el).then(ok => res(!!ok));
      if (el) el.classList.remove('playing');
      res(false);
    };
    sp.play().catch(() => {
      if (mine !== ptok) return res(false);
      if (window.LearnAudio) return LearnAudio.speak(text || '', 'en-IN', 0.92, el).then(ok => res(!!ok));
      if (el) el.classList.remove('playing');
      res(false);
    });
  });
}
const ding = () => { if (window.LearnAudio) LearnAudio.ding(); };
const buzz = () => { if (window.LearnAudio) LearnAudio.buzz(); };

function topicStars(id) { return Math.min(3, +(S[id] || 0)); }
function awardTopic(id, stars) {
  stars = Math.max(0, Math.min(3, stars));
  if ((S[id] || 0) < stars) { S[id] = stars; save(); return true; }
  return false;
}
function gotStars() { return TOPICS.reduce((n, t) => n + topicStars(t.id), 0); }
function totalStars() { return TOPICS.length * 3; }
function starStr(n) { return '⭐'.repeat(n) + '☆'.repeat(Math.max(0, 3 - n)); }

function home() {
  stopAudio();
  const g = gotStars(), t = totalStars(), pct = t ? Math.round(g / t * 100) : 0;
  app.innerHTML = `
  <div class="top">
    <a class="icon" href="../index.html" title="Home">🏠</a>
    <button type="button" class="icon" onclick="history.back()" title="Back">←</button>
    <div class="tt"><small>Class 3 · Joshua</small><b>🧠 General Knowledge</b></div>
    <span class="chip">⭐ ${g}/${t}</span>
  </div>
  <div class="hero">
    <div class="big">🧠</div>
    <h1>GK Adventure</h1>
    <p>Tap a topic · Listen · Earn stars!</p>
  </div>
  <div class="starbox">
    <div class="row"><span>⭐ My GK stars</span><span>${g}/${t} · ${pct}%</span></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
  </div>
  <div class="gtiles">
    ${TOPICS.map(t => `
      <button type="button" class="gt" style="--b:${t.grad}" onclick="openTopic('${t.id}')">
        <span class="i">${t.emoji}</span>
        <b>${esc(t.title)}</b>
        <small>${esc(t.blurb)}</small>
        <span class="st">${starStr(topicStars(t.id))}</span>
      </button>`).join('')}
  </div>
  <p class="tip">Tap 🔊 anytime — you can hear it again and again.</p>`;
}

let CUR = null, G = null;

function openTopic(id) {
  CUR = TOPICS.find(t => t.id === id);
  if (!CUR) return;
  document.getElementById('ovt').textContent = CUR.emoji + ' ' + CUR.title;
  document.getElementById('ovs').textContent = starStr(topicStars(CUR.id));
  ov.classList.add('show');
  document.body.style.overflow = 'hidden';
  showTopicHome();
}
function closeOv() {
  stopAudio();
  ov.classList.remove('show');
  document.body.style.overflow = '';
  CUR = null; G = null;
  home();
}
function showTopicHome() {
  stopAudio();
  const t = CUR;
  document.getElementById('ovb').innerHTML = `
    <div class="card">
      <div class="em">${t.emoji}</div>
      <h2>${esc(t.title)}</h2>
      <p>${esc(t.blurb)}</p>
      <button type="button" class="say" onclick="sayVid('${t.titleVid}','${esc(t.title)}. ${esc(t.blurb)}',this)">🔊</button>
    </div>
    <div class="modes">
      <button type="button" class="mode" style="background:linear-gradient(135deg,#06d6a0,#118ab2)" onclick="startLearn()">
        <span class="x">🎧</span>Learn<small>Listen to each fact</small>
      </button>
      <button type="button" class="mode" style="background:linear-gradient(135deg,#f77f00,#e63946)" onclick="startQuiz()">
        <span class="x">🎯</span>Quiz<small>Earn up to 3 stars</small>
      </button>
    </div>`;
  sayVid(t.titleVid, t.title + '. ' + t.blurb);
}

function startLearn() {
  G = { mode: 'learn', i: 0 };
  showLearn();
}
function showLearn() {
  const t = CUR, L = t.learn, i = G.i, card = L[i];
  document.getElementById('ovs').textContent = (i + 1) + '/' + L.length;
  document.getElementById('ovb').innerHTML = `
    <div class="prog">Fact ${i + 1} of ${L.length}</div>
    <div class="card">
      <div class="em">${card.em}</div>
      <h2>${esc(card.t)}</h2>
      <button type="button" class="say" onclick="sayVid('${card.vid}','${esc(card.t)}. ${esc(card.s)}',this)">🔊</button>
      <p style="margin-top:12px">${esc(card.s)}</p>
      <div class="dots">${L.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</div>
      <div class="learn-nav">
        <button type="button" class="nx alt" ${i === 0 ? 'disabled style="opacity:.4"' : ''} onclick="G.i--;showLearn()">← Back</button>
        ${i < L.length - 1
          ? `<button type="button" class="nx" onclick="G.i++;showLearn()">Next ➜</button>`
          : `<button type="button" class="nx" onclick="showTopicHome()">✅ Done</button>`}
      </div>
    </div>`;
  sayVid(card.vid, card.t + '. ' + card.s);
}

function startQuiz() {
  const q = shuffle(CUR.quiz.map((x, i) => ({ ...x, _i: i })));
  G = { mode: 'quiz', queue: q, i: 0, right: 0, done: false };
  showQuiz();
}
function showQuiz() {
  if (G.i >= G.queue.length) return endQuiz();
  const x = G.queue[G.i];
  G.done = false;
  document.getElementById('ovs').textContent = (G.i + 1) + '/' + G.queue.length + ' · ✓' + G.right;
  // shuffle options but track answer
  const opts = x.o.map((t, i) => ({ t, i, vid: x.oVids[i] }));
  const shuffled = shuffle(opts);
  G._ans = x.a;
  G._cur = x;
  document.getElementById('ovb').innerHTML = `
    <div class="prog">Question ${G.i + 1} of ${G.queue.length}</div>
    <div class="card">
      <div class="qtext">
        <button type="button" class="say sm" onclick="sayVid('${x.qVid}','${esc(x.q)}',this)">🔊</button>
        <span>${esc(x.q)}</span>
      </div>
      <div class="opts" id="opts">
        ${shuffled.map((o, k) => `
          <div class="opt" data-i="${o.i}" role="button" tabindex="0" onclick="pickOpt(this)">
            <button type="button" class="say sm" onclick="event.stopPropagation();sayVid('${o.vid}','${esc(o.t)}',this)">🔊</button>
            <span>${esc(o.t)}</span>
          </div>`).join('')}
      </div>
      <div class="fb" id="fb"></div>
      <div id="after"></div>
    </div>`;
  sayVid(x.qVid, x.q);
}

function pickOpt(btn) {
  if (!G || G.done) return;
  G.done = true;
  const chosen = +btn.getAttribute('data-i');
  const ok = chosen === G._ans;
  document.querySelectorAll('.opt').forEach(b => {
    b.style.pointerEvents = 'none';
    if (+b.getAttribute('data-i') === G._ans) b.classList.add('ok');
  });
  if (ok) {
    btn.classList.add('ok');
    G.right++;
    ding();
    document.getElementById('fb').className = 'fb good';
    document.getElementById('fb').textContent = 'Yes! 🌟';
  } else {
    btn.classList.add('bad');
    buzz();
    document.getElementById('fb').className = 'fb bad';
    document.getElementById('fb').textContent = 'Almost — listen to the right one';
  }
  const x = G._cur;
  document.getElementById('after').innerHTML = `
    <button type="button" class="say sm" onclick="sayVid('${x.aVid}','The answer is ${esc(x.o[x.a])}',this)">🔊</button>
    <button type="button" class="nx" onclick="G.i++;showQuiz()">Next ➜</button>`;
  sayVid(x.aVid, 'The answer is ' + x.o[x.a]);
}

function endQuiz() {
  const total = G.queue.length;
  const ratio = total ? G.right / total : 0;
  const stars = ratio >= 0.9 ? 3 : ratio >= 0.6 ? 2 : ratio >= 0.35 ? 1 : 0;
  const nb = awardTopic(CUR.id, stars);
  document.getElementById('ovs').textContent = starStr(topicStars(CUR.id));
  ding();
  document.getElementById('ovb').innerHTML = `
    <div class="card end">
      <div class="big">${stars === 3 ? '🏆' : stars ? '🥳' : '💪'}</div>
      <h2>Quiz done!</h2>
      <p style="font-size:18px">You got <b>${G.right}</b> / ${total} right</p>
      <div class="stars">${starStr(stars)}</div>
      <p style="margin-top:8px">${nb ? 'New best for this topic!' : 'Keep practising!'}</p>
      <div>
        <button type="button" class="nx" onclick="startQuiz()">🔁 Play again</button>
        <button type="button" class="nx alt" onclick="showTopicHome()">Topics</button>
      </div>
    </div>`;
}

home();
</script>
